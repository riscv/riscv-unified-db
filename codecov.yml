coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        # Don't count pure code removal as a coverage regression: adjust the
        # base coverage to exclude deleted lines. Real drops are still caught.
        removed_code_behavior: adjust_base
    patch:
      default:
        target: 50%

flag_management:
  default_rules: # the rules that will be followed for any flag added, generally
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
        removed_code_behavior: adjust_base
      - type: patch
        target: 50%
