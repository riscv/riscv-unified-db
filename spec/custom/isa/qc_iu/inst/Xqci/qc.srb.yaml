# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: qc.srb
long_name: Store indexed byte
description: |
  Store 8 bits of data from register `xs3` to an
  address formed by adding `xs1` to `xs2`, shifted by `shamt`.
definedBy:
  allOf:
    - xlen: 32
    - extension:
        name: Xqcisls
assembly: xs3, xs1, xs2, shamt
format:
  size: 32
  operands:
    - { $ref: inst_operand/qc.shamt3.yaml# }
    - { $ref: inst_operand/qc.xs2-n0.yaml# }
    - { $ref: inst_operand/xs1.yaml# }
    - { $ref: inst_operand/qc.xs3.yaml# }
  opcodes:
    - displayName: funct4
      location: 31-28
      value: 0b1101
    - displayName: funct3
      location: 14-12
      value: 0b110
    - { $ref: inst_opcode/custom-1.yaml# }
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  XReg virtual_address = X[xs1] + (X[xs2] << shamt);
  write_memory<8>(virtual_address, X[xs3][7:0], $encoding);
