# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: qc.setwmi
long_name: Set word multiple (Immediate)
description: |
  Stores the value of `xs3` multiple times into the address starting at (`xs1` + `uimm`).
  The number of writes is in length.
  Instruction encoded in R instruction format.
definedBy:
  allOf:
    - xlen: 32
    - extension:
        name: Xqcilsm
format:
  size: 32
  operands:
    - { $ref: inst_operand/qc.uimm8.yaml# }
    - { $ref: inst_operand/qc.length5-n0.yaml# }
    - { $ref: inst_operand/xs1.yaml# }
    - { $ref: inst_operand/qc.xs3.yaml# }
  opcodes:
    - displayName: funct2
      location: 31-30
      value: 0b11
    - displayName: funct3
      location: 14-12
      value: 0b111
    - { $ref: inst_opcode/custom-1.yaml# }
assembly: xs3, length, uimm(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  XReg vaddr = X[xs1] + uimm;
  Bits<32> write_value = X[xs3][31:0];
  for (U32 i = 0; i < length; i++) {
    write_memory<32>(vaddr, write_value, $encoding);
    vaddr = vaddr + 4;
  }
