# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: qc.mvgeu
long_name: Conditional move if great or equal than unsigned (Register)
description: |
  Move `xs3` to `xd` if the unsigned value in `xs1` is great or equal than unsigned value `xs2`.
  Instruction encoded in R4 instruction format.
definedBy:
  allOf:
    - xlen: 32
    - extension:
        name: Xqcicm
format:
  size: 32
  operands:
    - { $ref: inst_operand/qc.r4-xs3-n0.yaml# }
    - { $ref: inst_operand/qc.xs2-n0.yaml# }
    - { $ref: inst_operand/qc.xs1-n0.yaml# }
    - { $ref: inst_operand/qc.xd-n0-rw.yaml# }
  opcodes:
    - displayName: funct2
      location: 26-25
      value: 0b00
    - displayName: funct3
      location: 14-12
      value: 0b111
    - { $ref: inst_opcode/custom-2.yaml# }
assembly: xd, xs1, xs2, xs3
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  if (X[xs1] >= X[xs2]) {
    X[xd] = X[xs3];
  }
