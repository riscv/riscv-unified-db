# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: qc.swmi
long_name: Store word multiple (immediate)
description: |
  Stores multiple words from the registers starting at `xs3` to the address starting at (`xs1` + `uimm`).
  The number of words is in `length` immediate.
definedBy:
  allOf:
    - xlen: 32
    - extension:
        name: Xqcilsm
format:
  size: 32
  operands:
    - { $ref: inst_operand/qc.uimm8.yaml# }
    - { $ref: inst_operand/qc.length5-n0.yaml# }
    - { $ref: inst_operand/xs1.yaml# }
    - { $ref: inst_operand/qc.xs3-n0.yaml# }
  opcodes:
    - displayName: funct2
      location: 31-30
      value: 0b01
    - displayName: funct3
      location: 14-12
      value: 0b111
    - { $ref: inst_opcode/custom-1.yaml# }
assembly: xs3, length, uimm(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  XReg vaddr = X[xs1] + uimm;
  raise (ExceptionCode::IllegalInstruction, effective_ldst_mode(), $encoding) if ((xs3 + length) > 32);
  for (U32 i = 0; i < length; i++) {
    write_memory<32>(vaddr, X[xs3 + i], $encoding);
    vaddr = vaddr + 4;
  }
