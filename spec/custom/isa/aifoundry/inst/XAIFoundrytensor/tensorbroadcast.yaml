# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorbroadcast
long_name: TensorBroadcast
description: |
  Broadcast values from FP registers to the tensor unit for use as operands in subsequent
  tensor operations.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrytensor
base: 32
encoding:
  match: 0100010----------111-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1, xs2
access:
  s: always
  u: always
  vs: always
  vu: always
