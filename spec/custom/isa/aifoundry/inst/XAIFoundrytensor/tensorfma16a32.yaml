# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorfma16a32
long_name: TensorFMA16A32
description: |
  Multiply two FP16 matrices (A and B) from scratchpad, add the FP32 result to the FP32
  accumulator matrix C0 stored in FP registers (f0-fN), and write the result back to FP
  registers. This is the primary operation for ML inference with FP16 precision.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrytensor
base: 32
encoding:
  match: 0010000----------111-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1, xs2
access:
  s: always
  u: always
  vs: always
  vu: always
