# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorloadsetupb
long_name: TensorLoadSetupB
description: |
  Configure the tensor load unit for loading the B matrix in column-major order for
  matrix multiply operations.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrytensor
base: 32
encoding:
  match: 0000010----------111-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1, xs2
access:
  s: always
  u: always
  vs: always
  vu: always
