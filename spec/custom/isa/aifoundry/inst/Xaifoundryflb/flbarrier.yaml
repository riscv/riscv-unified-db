# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: flbarrier
long_name: FLBarrier
description: |
  Execute a barrier synchronization among all participating ET-Minion cores within the
  Shire. Encoded as CSRRW to CSR address 0x820. The source register rs1 layout:
  bits 12:5 = barrier ID, bits 4:0 = participation value. The core stalls until all
  cores in the barrier group have executed FLBarrier.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryflb
base: 32
encoding:
  match: -----------------001-----1110011
  variables:
    - name: csr
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, csr, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
