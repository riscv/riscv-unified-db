# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorima8a32
long_name: TensorIMA8A32
description: |
  Multiply two INT8 matrices (A and B), optionally add INT32 accumulator C0, write INT32
  result to FP registers. Uses the IMA units in each VPU lane (4 INT8
  multiply-accumulates per lane per cycle).
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 0010010----------111-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1, xs2
access:
  s: always
  u: always
  vs: always
  vu: always
