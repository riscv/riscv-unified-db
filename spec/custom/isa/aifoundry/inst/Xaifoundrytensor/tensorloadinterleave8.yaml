# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: tensorloadinterleave8
long_name: TensorLoadInterleave8
description: |
  Load 8-bit data from memory with interleaving pattern into L1 scratchpad.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrytensor
base: 32
encoding:
  match: 0000100----------111-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs1, xs2
access:
  s: always
  u: always
  vs: always
  vu: always
