# yaml-language-server: $schema=../../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: cacheflush
long_name: Cache Flush
description: |
  Flush dirty cache lines to next level. Encoded as a CSR write to ucache_control or
  mcache_control with CacheOp=Flush. The operation can target L1, L2, or L3 cache levels.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrycache
base: 32
encoding:
  match: -----------------001-----1110011
  variables:
    - name: csr
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, csr, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
