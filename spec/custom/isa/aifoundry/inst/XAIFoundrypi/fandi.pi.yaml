# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fandi.pi
long_name: Packed integer AND immediate
description: |
  Perform bitwise AND of a 20-bit immediate value with all 8 INT32 lanes
  of the destination packed integer register.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrypi
base: 32
encoding:
  match: -----------------101-----0011111
  variables:
    - name: imm
      location: 31-12
    - name: rd
      location: 11-7
assembly: fd, imm
access:
  s: always
  u: always
  vs: always
  vu: always
