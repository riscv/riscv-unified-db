# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsrai.pi
long_name: Packed integer shift right arithmetic immediate
description: |
  Perform element-wise arithmetic right shift across all 8 INT32 lanes of
  the packed integer source register by the immediate shift amount, writing
  the result to the destination packed integer register.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrypi
base: 32
encoding:
  match: 0011111----------010-----1111011
  variables:
    - name: shamt
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, shamt
access:
  s: always
  u: always
  vs: always
  vu: always
