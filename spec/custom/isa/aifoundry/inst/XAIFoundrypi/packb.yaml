# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: packb
long_name: Pack 32 bits from operands
description: |
  Pack 32-bit values from the two packed integer source registers into the
  destination packed integer register.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrypi
base: 32
encoding:
  match: 0100011----------000-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
