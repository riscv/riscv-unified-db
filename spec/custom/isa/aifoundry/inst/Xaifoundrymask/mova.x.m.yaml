# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: mova.x.m
long_name: Move all mask registers to integer register
description: |
  Pack all 8 mask registers (64 bits total) into a single integer destination
  register rd.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrymask
base: 32
encoding:
  match: 000100000000-----111-----1111011
  variables:
    - name: rd
      location: 11-7
assembly: xd
access:
  s: always
  u: always
  vs: always
  vu: always
