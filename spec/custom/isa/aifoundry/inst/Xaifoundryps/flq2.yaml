# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: flq2
long_name: Load 256-bit unmasked
description: |
  Load 256 bits (full packed-single register) from memory at address rs1+imm.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: -----------------101-----0000111
  variables:
    - name: imm
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, imm(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
