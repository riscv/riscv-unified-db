# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsq2
long_name: Store 256-bit unmasked
description: |
  Store 256 bits (full packed-single register) to memory.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: -----------------101-----0100111
  variables:
    - name: imm
      location: 31-25|11-7
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
assembly: fs2, imm(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
