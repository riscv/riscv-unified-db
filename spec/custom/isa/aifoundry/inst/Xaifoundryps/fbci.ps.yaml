# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fbci.ps
long_name: Broadcast immediate
description: |
  Broadcast a 20-bit immediate (sign-extended/formatted as FP32) to all 8 lanes.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: -------------------------0011111
  variables:
    - name: imm
      location: 31-12
    - name: rd
      location: 11-7
assembly: fd, imm
access:
  s: always
  u: always
  vs: always
  vu: always
