$schema: inst_schema.json#
kind: instruction
name: flem.ps
long_name: Packed single compare less-or-equal to mask
description: |
  Packed single compare less-or-equal, write to mask register.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryps
base: 32
encoding:
  match: 1010000----------100-----1111011
  variables:
    - name: rs2
      location: 24-20
