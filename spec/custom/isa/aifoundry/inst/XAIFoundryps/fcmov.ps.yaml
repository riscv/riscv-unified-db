# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcmov.ps
long_name: Packed single conditional move
description: |
  Packed single conditional move. For each lane, if fs3 element is non-zero, write fs1 element to fd; otherwise write fs2 element.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryps
base: 32
encoding:
  match: -----10----------010-----0111111
  variables:
    - name: rs3
      location: 31-27
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2, fs3
access:
  s: always
  u: always
  vs: always
  vu: always
