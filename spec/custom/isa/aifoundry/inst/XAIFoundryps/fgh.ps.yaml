# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fgh.ps
long_name: Gather halfword
description: |
  Gather 8 halfwords sign-extended to 32 bits.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryps
base: 32
encoding:
  match: 0101000----------001-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
