# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fbcx.ps
long_name: Broadcast extend
description: |
  Broadcast the 32-bit value in integer register rs1 to all 8 elements of the destination PS register.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryps
base: 32
encoding:
  match: 000000000000-----011-----0001011
  variables:
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
