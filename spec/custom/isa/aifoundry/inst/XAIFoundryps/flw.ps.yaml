# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: flw.ps
long_name: Load word packed single
description: |
  Load a 32-bit word from memory and broadcast it to all 8 lanes of the destination PS register.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryps
base: 32
encoding:
  match: -----------------010-----0001011
  variables:
    - name: imm
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, imm(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
