# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: feq.ps
long_name: Packed single compare equal
description: |
  Packed single compare equal. Result is bitmask in integer register.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryps
base: 32
encoding:
  match: 1010000----------010-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
