# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsub.ps
long_name: Packed single FP32 subtract
description: |
  Packed single FP32 subtract.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryps
base: 32
encoding:
  match: 0000100------------------1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
