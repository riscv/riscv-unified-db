# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsw.ps
long_name: Store word packed single
description: |
  Store lane 0 of a PS register as a 32-bit word to memory.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryps
base: 32
encoding:
  match: -----------------110-----0001011
  variables:
    - name: imm
      location: 31-25|11-7
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
assembly: fs2, imm(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
