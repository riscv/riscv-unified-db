# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.pw.ps
long_name: Convert FP32 to signed INT32
description: |
  Convert 8 FP32 values to signed INT32.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryps
base: 32
encoding:
  match: 1100000--00000-----------1111011
  variables:
    - name: rs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: rd
      location: 11-7
assembly: fd, fs1
access:
  s: always
  u: always
  vs: always
  vu: always
