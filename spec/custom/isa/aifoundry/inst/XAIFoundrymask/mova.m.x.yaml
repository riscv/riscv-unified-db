# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: mova.m.x
long_name: Move integer register to all mask registers
description: |
  Unpack the integer source register rs1 into all 8 mask registers, with
  each mask register receiving 8 bits from the source.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrymask
base: 32
encoding:
  match: 000101000000-----111-----1111011
  variables:
    - name: rs1
      location: 19-15
assembly: xs1
access:
  s: always
  u: always
  vs: always
  vu: always
