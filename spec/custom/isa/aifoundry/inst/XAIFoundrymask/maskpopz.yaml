# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: maskpopz
long_name: Mask population count of clear bits
description: |
  Count the number of 0-bits (clear bits) in the mask register ms1, writing
  the count to the integer destination register rd.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrymask
base: 32
encoding:
  match: 001000000000-----111-----1111011
  variables:
    - name: ms1
      location: 17-15
    - name: rd
      location: 11-7
assembly: xd, ms1
access:
  s: always
  u: always
  vs: always
  vu: always
