# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: masknot
long_name: Mask register NOT
description: |
  Perform bitwise NOT of a mask register, writing the result to the
  destination mask register. md = NOT ms1.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundrymask
base: 32
encoding:
  match: 000011000000-----111-----1111011
  variables:
    - name: ms1
      location: 17-15
    - name: md
      location: 9-7
assembly: md, ms1
access:
  s: always
  u: always
  vs: always
  vu: always
