# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: shg
long_name: Store halfword global
description: |
  Store a halfword to global memory via memory controller.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryamo
base: 32
encoding:
  match: 0000001----------001-----0101011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
