# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fgbg.ps
long_name: Gather byte global PS
description: |
  Gather bytes from global memory using per-lane addresses via memory controller.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryamo
base: 32
encoding:
  match: 0100111----------001-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
