# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: famoorl.pi
long_name: Atomic OR local PI
description: |
  Atomically OR each PI lane value with local memory at shire cache level.
  Returns the original memory values.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryamo
base: 32
encoding:
  match: 0001110----------101-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
