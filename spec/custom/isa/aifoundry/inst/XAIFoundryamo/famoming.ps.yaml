# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: famoming.ps
long_name: Atomic FP min global PS
description: |
  Atomically compute the floating-point minimum of each PS lane value and
  global memory via memory controller. Returns the original memory values.
definedBy:
  anyOf:
    - XAIFoundry
    - XAIFoundryamo
base: 32
encoding:
  match: 0100111----------101-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
