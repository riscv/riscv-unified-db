# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fandi.pi
long_name: Packed integer AND immediate
description: |
  Perform bitwise AND of a 5-bit zero-extended immediate with all 8 INT32
  lanes of the packed integer source register, writing the result to the
  destination.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrypi
base: 32
encoding:
  match: 0100111----------001-----1111011
  variables:
    - name: imm
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, imm
access:
  s: always
  u: always
  vs: always
  vu: always
