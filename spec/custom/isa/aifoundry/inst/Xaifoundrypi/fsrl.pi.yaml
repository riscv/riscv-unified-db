# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsrl.pi
long_name: Packed integer shift right logical
description: |
  Perform element-wise logical right shift across all 8 INT32 lanes of the
  packed integer source register by the shift amount in the second source
  register, writing the result to the destination packed integer register.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrypi
base: 32
encoding:
  match: 0011101----------001-----1111011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, fs2
access:
  s: always
  u: always
  vs: always
  vu: always
