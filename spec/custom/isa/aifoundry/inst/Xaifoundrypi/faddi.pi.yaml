# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: faddi.pi
long_name: Packed integer add immediate
description: |
  Add a 10-bit sign-extended immediate value to all 8 INT32 lanes of the
  packed integer source register, writing the result to the destination.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrypi
base: 32
encoding:
  match: -----10----------001-----0111111
  variables:
    - name: imm_hi
      location: 31-27
    - name: imm_lo
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs1, imm
access:
  s: always
  u: always
  vs: always
  vu: always
