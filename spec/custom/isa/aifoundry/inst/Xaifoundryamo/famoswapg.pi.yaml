# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: famoswapg.pi
long_name: Atomic swap global PI
description: |
  Atomically swap each PI lane value with global memory via memory controller.
  Returns the original memory values.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryamo
base: 32
encoding:
  match: 0000111----------101-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
