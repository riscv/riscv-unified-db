# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: amoaddl.d
long_name: Atomic add local doubleword
description: |
  Atomically add a 64-bit doubleword in local (shire) memory with the value in rs2.
  The original memory value is loaded into rd.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryamo
base: 32
encoding:
  match: 00000-0----------011-----0101011
  variables:
    - name: aq
      location: 26
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
