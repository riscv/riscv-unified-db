# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fswg.ps
long_name: Store word global PS
description: |
  Store lane 0 of PS register to global memory via memory controller.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryamo
base: 32
encoding:
  match: 1000011----------001-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rs3
      location: 11-7
assembly: fs3, fs2(xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
