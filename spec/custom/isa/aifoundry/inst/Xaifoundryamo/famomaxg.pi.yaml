# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: famomaxg.pi
long_name: Atomic max global PI
description: |
  Atomically compute the signed maximum of each PI lane value and global memory
  via memory controller. Returns the original memory values.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryamo
base: 32
encoding:
  match: 0011011----------101-----0001011
  variables:
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: fd, fs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
