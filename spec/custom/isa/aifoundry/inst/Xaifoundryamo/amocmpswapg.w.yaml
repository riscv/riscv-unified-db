# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: amocmpswapg.w
long_name: Atomic compare-and-swap global word
description: |
  Atomically compare and swap a 32-bit word in global memory via memory controller.
  If the memory value matches rd, it is replaced with rs2.
  The original memory value is loaded into rd.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundryamo
base: 32
encoding:
  match: 00010-1----------010-----0101011
  variables:
    - name: aq
      location: 26
    - name: rs2
      location: 24-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, xs2, (xs1)
access:
  s: always
  u: always
  vs: always
  vu: always
