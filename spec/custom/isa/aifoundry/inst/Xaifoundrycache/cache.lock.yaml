# yaml-language-server: $schema=../../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: cache.lock
long_name: Cache Lock
description: |
  Lock cache line at specified address. Encoded as CSRRW to ucache_control (0x8C0) or mcache_control (0x7C0) with CacheOp=Lock in the source register.
definedBy:
  anyOf:
    - Xaifoundry
    - Xaifoundrycache
base: 32
encoding:
  match: -----------------001-----1110011
  variables:
    - name: csr
      location: 31-20
    - name: rs1
      location: 19-15
    - name: rd
      location: 11-7
assembly: xd, csr, xs1
access:
  s: always
  u: always
  vs: always
  vu: always
