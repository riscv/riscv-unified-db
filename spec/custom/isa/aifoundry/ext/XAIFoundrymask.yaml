kind: extension
name: XAIFoundrymask
type: unprivileged
long_name: AI Foundry SIMD Mask extension
company:
  name: AI Foundry
  url: https://github.com/aifoundry-org
versions:
- version: "1.0.0"
  state: development
  ratification_date: null
  contributors:
  - name: Gianluca Guida
    company: AI Foundry
description: |
  The Mask extension adds 8 mask registers (m0-m7) to the hart's architectural state.
  Each mask register is 8 bits wide, one bit per SIMD lane.

  The m0 register is special: it controls execution masking for all Packed Single (PS)
  and Packed Integer (PI) instructions. When bit N of m0 is clear, lane N of a PS/PI
  operation produces zero.

  The extension provides logical operations on mask registers (AND, OR, XOR, NOT),
  population count instructions, and move instructions to transfer mask state to/from
  integer registers for context switching.

  Instructions:

  * MASKAND -- Logical AND of two mask registers
  * MASKOR -- Logical OR of two mask registers
  * MASKXOR -- Logical XOR of two mask registers
  * MASKNOT -- Logical NOT of a mask register
  * MOVA.X.M -- Move all 8 mask registers to an integer register
  * MOVA.M.X -- Move an integer register to all 8 mask registers
  * MOV.M.X -- Move a single mask register to an integer register
  * MASKPOPC -- Population count of set bits in a mask register
  * MASKPOPZ -- Population count of clear bits in a mask register
