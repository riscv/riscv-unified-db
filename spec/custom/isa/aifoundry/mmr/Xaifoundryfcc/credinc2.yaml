# yaml-language-server: $schema=../../../../schemas/mmr_schema.json

$schema: mmr_schema.json#
kind: mmr
name: credinc2
long_name: Credit Increment Register 2
description: |
  Memory-mapped register to increment fast credit counter 2.
  Writing to this register adds credits to the specified counter.
definedBy: Xaifoundryfcc
physical_address: 0x01C0040210
length: 64
writable: true
fields:
  VALUE:
    location: 63-0
    description: |
      Credit increment value (write-only).
    type: RW
    reset_value: 0
