# yaml-language-server: $schema=../../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: tensor_error
long_name: Tensor Error Status
address: 0x808
priv_mode: U
length: 64
writable: true
description: |
  Records error conditions during execution of tensor and cache management
  operations. Software should check this register after tensor operations
  complete.
definedBy:
  anyOf:
    - name: XAIFoundry
    - name: XAIFoundrytensor
fields:
  ERROR:
    location: 63-0
    type: RW-H
    reset_value: 0
    description: Error status for tensor and cache management operations.
