# yaml-language-server: $schema=../../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: tensor_mask
long_name: Tensor Operation Mask
address: 0x805
priv_mode: U
length: 64
writable: true
description: |
  Provides a bitmask for tensor and cache control operations. When enabled via
  the instruction's control field bit 63, individual operations in a multi-line
  sequence can be selectively skipped.
definedBy:
  anyOf:
    - name: XAIFoundry
    - name: XAIFoundrytensor
fields:
  MASK:
    location: 63-0
    type: RW
    reset_value: 0
    description: Bitmask for tensor and cache control operations.
