# yaml-language-server: $schema=../../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: fccnb
long_name: Fast Credit Counter (Non-Blocking)
address: 0xCC0
priv_mode: U
length: 64
writable: false
description: |
  Non-blocking read of the Fast Credit Counter. Returns the current counter
  value without blocking or decrementing. Used to poll the credit counter state.
definedBy:
  anyOf:
    - name: Xaifoundry
    - name: Xaifoundryfcc
fields:
  COUNTER0:
    location: 15-0
    type: RO-H
    reset_value: 0
    description: Hart's first credit counter.
  COUNTER1:
    location: 31-16
    type: RO-H
    reset_value: 0
    description: Hart's second credit counter.
