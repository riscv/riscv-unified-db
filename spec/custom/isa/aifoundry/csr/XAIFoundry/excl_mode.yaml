# yaml-language-server: $schema=../../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: excl_mode
long_name: Exclusive Mode Control
address: 0x7C4
priv_mode: M
length: 64
writable: true
description: |
  Controls the exclusive execution mode for the ET-Minion core. When enabled,
  the core operates in an exclusive mode that affects how memory operations and
  synchronization are handled.
definedBy:
  name: XAIFoundry
fields:
  ENABLE:
    location: 0
    type: RW
    reset_value: 0
    description: Exclusive mode enable.
