# yaml-language-server: $schema=../../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: minstmask
long_name: Machine Instruction Match Mask
address: 0x7C1
priv_mode: M
length: 64
writable: true
description: |
  Instruction match mask register. Used in conjunction with minstmatch for
  hardware breakpoint/trigger functionality on specific instruction patterns.
definedBy:
  name: XAIFoundry
fields:
  MASK:
    location: 63-0
    type: RW
    reset_value: 0
    description: Instruction match mask pattern.
