# yaml-language-server: $schema=../../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: tensor_coop
long_name: Tensor Cooperative Load Control
address: 0x804
priv_mode: U
length: 64
writable: true
description: |
  Controls cooperative tensor load operations. When enabled, multiple minions'
  tensor load requests to the same memory location are coalesced into a single
  request for better performance and power.
definedBy:
  anyOf:
    - name: Xaifoundry
    - name: Xaifoundrytensor
fields:
  GROUP:
    location: 4-0
    type: RW
    reset_value: 0
    description: Cooperation ID (0-15).
  MINIONS:
    location: 15-8
    type: RW
    reset_value: 0
    description: Minion cooperation mask.
  NEIGHS:
    location: 19-16
    type: RW
    reset_value: 0
    description: Neighborhood cooperation mask.
