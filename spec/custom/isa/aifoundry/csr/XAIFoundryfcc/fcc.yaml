# yaml-language-server: $schema=../../../../../schemas/csr_schema.json

$schema: csr_schema.json#
kind: csr
name: fcc
long_name: Fast Credit Counter (Blocking)
address: 0x806
priv_mode: U
length: 64
writable: false
description: |
  Blocking read of the Fast Credit Counter. Reading this CSR blocks the hart
  until the credit counter is non-zero, then returns the counter value and
  decrements it. Used for credit-based inter-core flow control within a Shire.
definedBy:
  anyOf:
    - name: XAIFoundry
    - name: XAIFoundryfcc
fields:
  COUNT:
    location: 63-0
    type: RO-H
    reset_value: 0
    description: Current credit counter value (blocking read).
