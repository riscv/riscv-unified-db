# yaml-language-server: $schema=../../../schemas/operand_schema.json

$schema: "operand_schema.json#"
kind: operand
name: xsc-offset7-ls2
description: general purpose register base compressed with 7-bit offset shifted 2 bits
data:
  $inherits: operand/xsc.yaml#/data
  offset:
    name: imm
    possible_values: [0-124]
    left_shifted: 2
    decode(): return imm << 2;
  decode(): |
    return creg2reg(xs1);
