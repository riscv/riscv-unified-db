# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: MUTABLE_MISA_D
description:
  "Indicates whether or not the `D` extension can be disabled with the
  `misa.D` bit.

  "
long_name: "`misa.D` mutability"
schema:
  type: boolean
requirements:
  idl(): MUTABLE_MISA_F -> MUTABLE_MISA_D;
  reason:
    If F can be disabled, then D must also be disabled since D cannot exist
    without F (and thus there is no option for MUTABLE_MISA_D).
definedBy:
  extension:
    allOf:
      - name: D
      - name: Sm
