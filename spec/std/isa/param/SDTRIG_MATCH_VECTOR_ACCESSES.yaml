# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SDTRIG_MATCH_VECTOR_ACCESSES
description: |
  If true, mcontrol6 load and store triggers match vector loads and stores as if each element
  access happened individually, with size SEW (Debug spec 1.0, 5.1.5.2 "Combined Accesses").
  If false, mcontrol6 load and store triggers do not match vector memory accesses.
long_name: Triggers match vector accesses
schema:
  type: boolean
definedBy:
  allOf:
    - extension:
        name: Sdtrig
    - extension:
        name: Zve32x
    - param:
        name: SDTRIG_MCONTROL6_SUPPORTED_TRIGGERS
        includes: true
        reason: Only relevant if at least one trigger supports mcontrol6.
