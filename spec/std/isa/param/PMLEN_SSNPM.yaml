# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: PMLEN_SSNPM
description: |
  The number of high-order bits of an address that are masked by the
  `Ssnpm` pointer masking facility for the next privilege mode below
  S-mode (U-mode, and VS-/VU-modes if the H extension is present),
  selectable via the `PMM` field in `senvcfg`.

  Options:

    0::
      Pointer masking disabled (`PMM`=00).
    7::
      PMLEN=XLEN-57 (i.e., PMLEN=7 on RV64)
    16::
      PMLEN=XLEN-48 (i.e., PMLEN=16 on RV64)

  The current standard only supports these values (`zpm.adoc`, tag
  `norm:pmlen_supported_values`, plus the mandatory PMM=00 disabled
  setting). If only one value is given, `PMM` is assumed to be
  read-only with that value. Otherwise, `PMM` is read-write and
  software selects between the given values.
long_name: TODO
schema:
  type: array
  items:
    type: integer
    enum: [0, 7, 16]
  minItems: 1
  maxItems: 3
  uniqueItems: true
definedBy:
  extension:
    name: Ssnpm
