$schema: param_schema.json#
kind: parameter
name: MSI_INTR_IMPL
description: |
  Whether or not machine-level software interrupts are implemented.

  Possible values:

  true::
    Machine-level software interrupts are implemented. `mie.MSIE` is writable.

  false::
    Machine-level software interrupts are not implemented.
    `mie.MSIE` and `mideleg[3]` are read-only zero.
