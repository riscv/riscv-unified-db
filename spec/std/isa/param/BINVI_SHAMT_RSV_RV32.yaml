# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: BINVI_SHAMT_RSV_RV32
long_name: TODO
description: |
  For RV32, the encodings of the `binvi` instruction corresponding to shamt[5]=1 are reserved
  (`zb.adoc`, tag `norm:binvi_shamt_rsv_rv32`).

  Options:

    * true: Executing a reserved shamt[5]=1 encoding causes an IllegalInstruction exception.
    * false: Executing a reserved shamt[5]=1 encoding results in UNDEFINED_LEGAL behavior.
schema:
  type: boolean
definedBy:
  extension:
    name: Zbs
