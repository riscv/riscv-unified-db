# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: MSTATEEN1_SE1_TYPE
long_name: Behavior of mstateen1.SE1
description: |
  Behavior of the `mstateen1.SE1`, which controls access to
  `hstateen1`, `hstateen1h`, and `sstateen1`:

    * 'rw': read-write
    * 'read-only-0': read-only, fixed to 0
    * 'read-only-1': read-only, fixed to 1

  `mstateen1.SE1` may be read-only zero only if the hypervisor extension is not
  implemented and `sstateen1` is all read-only zeros.
  No bits of `sstateen1` are currently defined, so only the hypervisor
  condition applies.
schema:
  type: string
  enum:
    - rw
    - read-only-0
    - read-only-1
definedBy:
  extension:
    name: Smstateen
requirements:
  # mstateen1.SE1 cannot be read-only zero when H is implemented
  if:
    extension:
      name: H
  then:
    param:
      name: MSTATEEN1_SE1_TYPE
      notEqual: read-only-0
