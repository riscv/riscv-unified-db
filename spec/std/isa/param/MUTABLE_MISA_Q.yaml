# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: MUTABLE_MISA_Q
description:
  "Indicates whether or not the `Q` extension can be disabled with the
  `misa.Q` bit.

  "
long_name: "`misa.Q` mutability"
schema:
  type: boolean
requirements:
  idl(): MUTABLE_MISA_D -> MUTABLE_MISA_Q;
  reason:
    If D can be disabled, then Q must also be disabled since Q cannot exist
    without D (and thus there is no option for MUTABLE_MISA_Q).
definedBy:
  extension:
    allOf:
      - name: Q
      - name: Sm
