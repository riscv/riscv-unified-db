# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: CACHE_BLOCK_SIZE
description: "The observable size of a cache block, in bytes

  "
long_name: TODO
schema:
  # A cache block is a "naturally aligned power-of-two (or NAPOT) range of memory
  # locations" (RISC-V CMO spec, Zicbom/Zicbop/Zicboz). The previous bounds
  # (1 .. 2**64-1) admitted non-power-of-two sizes.
  $ref: schema_defs.json#/$defs/64bit_unsigned_pow2
definedBy:
  extension:
    anyOf:
      - name: Zicbom
      - name: Zicbop
      - name: Zicboz
