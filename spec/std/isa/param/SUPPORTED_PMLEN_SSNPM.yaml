# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: SUPPORTED_PMLEN_SSNPM
description: |
  The `PMLEN` values supported by the `Ssnpm` pointer masking facility
  for the next privilege mode below S-mode (U-mode, and VS-/VU-modes if
  the H extension is present), selected via the `PMM` field in
  `senvcfg`. `PMLEN` is the number of high-order bits of an address
  that are masked.

  Options:

    7::
      PMLEN=XLEN-57 (i.e., PMLEN=7 on RV64)
    16::
      PMLEN=XLEN-48 (i.e., PMLEN=16 on RV64)

  The current standard only supports these values (`zpm.adoc`, tag
  `norm:pmlen_supported_values`). `PMM`=00 (pointer masking disabled,
  PMLEN=0) is mandatory and always available, so it is not enumerated
  here.
long_name: Pointer mask length for next mode below S-mode
schema:
  type: array
  items:
    type: integer
    enum: [7, 16]
  minItems: 1
  maxItems: 2
  uniqueItems: true
definedBy:
  extension:
    name: Ssnpm
