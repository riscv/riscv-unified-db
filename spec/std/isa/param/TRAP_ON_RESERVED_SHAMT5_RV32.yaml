# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: TRAP_ON_RESERVED_SHAMT5_RV32
long_name: TODO
description: |
  For RV32, several single-bit and rotate immediate instructions reserve the
  encodings corresponding to shamt[5]=1: `bclri`, `bexti`, `binvi`, `bseti`
  (`zb.adoc`, tags `norm:bclri_shamt_rsv_rv32`, `norm:bexti_shamt_rsv_rv32`,
  `norm:binvi_shamt_rsv_rv32`, `norm:bseti_shamt_rsv_rv32`) and `rori`
  (`zb.adoc` / `zk.adoc`, untagged in the source but identical wording).

  This is distinct from TRAP_ON_RESERVED_INSTRUCTION, which covers fetching
  an entirely unassigned opcode. Here, the instruction itself is defined and
  implemented; only a specific immediate field value is reserved.

  Options:

    * true: Executing a reserved shamt[5]=1 encoding of any of these instructions causes an IllegalInstruction exception.
    * false: Executing a reserved shamt[5]=1 encoding of any of these instructions results in UNDEFINED_LEGAL behavior.
schema:
  type: boolean
definedBy:
  allOf:
    - extension:
        anyOf:
          - name: Zbs
          - name: Zbb
          - name: Zbkb
    - param:
        name: MXLEN
        equal: 32
