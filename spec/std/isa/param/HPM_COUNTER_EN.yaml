$schema: param_schema.json#
kind: parameter
name: HPM_COUNTER_EN
description: |
  Whether each HPM counter is implemented in hardware.

  `HPM_COUNTER_EN[n]` being `false` means `hpmcounter<n>`/`mhpmcounter<n>` and the
  corresponding `mhpmevent<n>` are not implemented and are hardwired read-only zero.
  It does *not* mean the counter is implemented but currently stopped from counting;
  that is a separate, run-time concept controlled by `mcountinhibit`
  (see `COUNTINHIBIT_EN`).

  There is one entry for each hpmcounter, indexed 0-31.

  Indices 0-2 *must* be false: they are reserved slots for the mandatory `cycle`/`mcycle`
  (CY), `time` (TM), and `instret`/`minstret` (IR) counters, in that order, which are not
  optional HPM counters and so this parameter never applies to them. The slots exist only
  so index N lines up with the CY=0/TM=1/IR=2/HPM_*n*=*n* numbering used by `mcounteren`
  (and `scounteren`/`hcounteren`). Note that `mcountinhibit` has no `TM` bit at all -- the
  `time` counter cannot be inhibited since it mirrors an external time source rather than
  counting locally.
  Index 3 in HPM_COUNTER_EN corresponds to mhpmcounter3.
  Index 31 in HPM_COUNTER_EN corresponds to mhpmcounter31.
