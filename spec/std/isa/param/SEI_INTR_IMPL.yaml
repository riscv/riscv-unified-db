$schema: param_schema.json#
kind: parameter
name: SEI_INTR_IMPL
description: |
  Whether or not supervisor-level external interrupts are implemented.

  Possible values:

  true::
    Supervisor-level external interrupts are implemented. `mie.SEIE` is writable.

  false::
    Supervisor-level external interrupts are not implemented.
    `mie.SEIE` and `mideleg[9]` are read-only zero.
