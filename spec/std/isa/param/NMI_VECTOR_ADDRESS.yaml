# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: NMI_VECTOR_ADDRESS
long_name: |
  Non-maskable interrupt vector address
definedBy:
  extension:
    name: Sm
description: |
  The address the hart jumps to when a base (unresumable) non-maskable
  interrupt is taken. NMIs cause an immediate jump to an
  implementation-defined NMI vector running in M-mode, regardless of the
  state of the hart's interrupt enable bits. Note that the `Smrnmi` extension
  defines a separate, resumable NMI mechanism with its own handler address
  (`RNMI_INTERRUPT_TRAP_ADDRESS`).

schema:
  $ref: schema_defs.json#/$defs/uint64

requirements:
  idl(): |
    (MXLEN == 32) -> (NMI_VECTOR_ADDRESS <= 32'hffffffff);
  reason: |
    The NMI vector is a program counter value, which is MXLEN bits wide.
