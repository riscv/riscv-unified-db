# yaml-language-server: $schema=../../../schemas/param_schema.json

$schema: param_schema.json#
kind: parameter
name: RNMI_EXCEPTION_TRAP_ADDRESS
long_name: |
  RNMI exception trap handler address
definedBy:
  extension:
    name: Smrnmi
description: |
  The address to which the program counter is set when the hart encounters an
  exception while executing in M-mode with `mnstatus.NMIE` clear. The RNMI
  exception trap handler address is implementation-defined. For example, an
  implementation might use the address specified in `mtvec`.

schema:
  $ref: schema_defs.json#/$defs/uint64

requirements:
  idl(): |
    (MXLEN == 32) -> (RNMI_EXCEPTION_TRAP_ADDRESS <= 32'hffffffff);
  reason: |
    The handler address is a program counter value, which is MXLEN bits wide.
