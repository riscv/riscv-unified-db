# yaml-language-server: $schema=../../../schemas/ext_schema.json

$schema: "ext_schema.json#"
kind: extension
name: Zvl4096b
long_name: Vector register length must be at least 4096 bits
description: |
  The Zvl4096b extension requires the implementation to have a vector register
  length (VLEN) of at least 4096 bits.

  The Zvl*b extensions are a family of extensions that specify minimum vector
  register lengths. They allow software to determine the minimum VLEN supported
  by an implementation without needing to probe at runtime.

  With VLEN=4096 and SEW=8 bits, VLMAX is 512 elements (with LMUL=1).
type: unprivileged
versions:
  - version: "1.0.0"
    state: ratified
    ratification_date: 2021-11
requirements:
  allOf:
    - extension:
        name: Zvl2048b
    - param:
        name: VLEN
        greaterThanOrEqual: 4096
