# yaml-language-server: $schema=../../../schemas/csr_schema.json

$schema: "csr_schema.json#"
kind: csr
name: hstatus
long_name: Hypervisor Status
address: 0x600
writable: true
priv_mode: S
length: SXLEN
description: |
  The hstatus register tracks and controls a VS-mode guest.

  Unlike fields in `sstatus`, which are all aliases of fields `mstatus`,
  bits in `hstatus` are independent bits and do not have aliases.
definedBy:
  extension:
    name: H
fields:
  HUPMM:
    long_name: Hypervisor U-mode Pointer Masking Mode
    location: 49-48
    definedBy:
      allOf:
        - xlen: 64
        - extension:
            name: Ssnpm
    description: |
      Enables or disables pointer masking for `HLV.*` and `HSV.*` instructions
      executed in U-mode when their explicit memory access is performed as
      though in VU-mode. It uses the same encodings as `henvcfg.PMM`.

      [separator="!",%autowidth]
      !===
      ! Value ! Description

      ! 00 ! Pointer masking is disabled (PMLEN = 0)
      ! 01 ! _Reserved_
      ! 10 ! Pointer masking is enabled with PMLEN = XLEN - 57 (PMLEN = 7 on RV64)
      ! 11 ! Pointer masking is enabled with PMLEN = XLEN - 48 (PMLEN = 16 on RV64)
      !===

      In HS- and M-modes, pointer masking for these instructions is controlled
      by `senvcfg.PMM` when their access is performed as though in VU-mode, and
      by `henvcfg.PMM` when it is performed as though in VS-mode.

      `HUPMM` is a WARL field. The supported PMLEN values are given by
      `SUPPORTED_PMLEN_SSNPM`. A write of the reserved encoding, or of an
      encoding whose PMLEN is not supported, leaves `HUPMM` unchanged.
      Enabling pointer masking while VU-mode runs with XLEN=32 is also an
      illegal write that leaves `HUPMM` unchanged, and selecting XLEN=32 for
      VU-mode (`vsstatus.UXL`, or `hstatus.VSXL` or `mstatus.SXL`, which force
      VU-mode to XLEN=32) clears `HUPMM`.

      When the Ssnpm extension is not implemented, `HUPMM` is read-only zero.
      `HUPMM` is read-only zero for RV32, and also when VU-mode can only run
      with XLEN=32 (HS-mode, VS-mode or VU-mode only supports XLEN=32).

      [NOTE]
      ====
      The hypervisor should copy the value written to `senvcfg.PMM` by the guest to
      `hstatus.HUPMM` before invoking `HLV.*` or `HSV.*` instructions in U-mode.
      ====
    type(): |
      if (($array_size(SUPPORTED_PMLEN_SSNPM) == 1) ||
          (($array_size(VUXLEN) == 1) && (VUXLEN[0] == 32))) {
        return CsrFieldType::RO;
      }
      return CsrFieldType::RWR;
    reset_value(): |
      if (($array_size(SUPPORTED_PMLEN_SSNPM) == 1) ||
          (($array_size(VUXLEN) == 1) && (VUXLEN[0] == 32))) {
        return 0;
      }
      return UNDEFINED_LEGAL;
    sw_write(csr_value): |
      if (csr_value.HUPMM == 0) {
        return csr_value.HUPMM;
      }
      if (((csr_value.HUPMM == 2) && $array_includes?(SUPPORTED_PMLEN_SSNPM, 7)) ||
          ((csr_value.HUPMM == 3) && $array_includes?(SUPPORTED_PMLEN_SSNPM, 16))) {
        # Enabling pointer masking while VU-mode runs with XLEN=32 is an
        # illegal write. VSXL can change in the same write, and widening it
        # also widens vsstatus.UXL, so check VU-mode against the values this
        # write leaves.
        Bits<2> new_vsxl = vsxl_after_write(csr_value.VSXL);
        if (pointer_masking_vu_xlen32?(new_vsxl, vsstatus_uxl_after_vsxl_write(new_vsxl))) {
          return CSR[hstatus].HUPMM;
        }
        return csr_value.HUPMM;
      }
      # 01 is reserved, and an unsupported PMLEN is an illegal write:
      # both leave HUPMM unchanged
      return CSR[hstatus].HUPMM;
  VSXL:
    long_name: VS-mode XLen
    location: 33-32
    definedBy:
      xlen: 64
    description:
      - text: |
          Determines the effective XLEN in VS-mode. Valid values are:

          [separator="!"]
          !===
          ! Value ! VSXLEN

          ! 1     ! 32
          ! 2     ! 64
          !===

          When HSXLEN is changed from 32 to 64, VSXL gets the value 2 (VSXLEN=64).
        when(): return $array_size(VSXLEN) > 1;

      - text: |
          Because the implementation only supports a single VSXLEN == 32, this field is read-only-1.
        when(): return $array_size(VSXLEN) == 1 && $array_includes?(VSXLEN, 32);

      - text: |
          Because the implementation only supports a single VSXLEN == 64, this field is read-only-2.
        when(): return $array_size(VSXLEN) == 1 && $array_includes?(VSXLEN, 64);

    type(): |
      if ($array_size(VSXLEN) == 1) {
        return CsrFieldType::RO;
      } else {
        return CsrFieldType::RW;
      }
    reset_value(): |
      if ($array_size(VSXLEN) == 1 && VSXLEN[0] == 32) {
        # immutable, always 1 (XLEN=32)
        return $bits(XRegWidth::XLEN32);
      } else if ($array_size(VSXLEN) == 1 && VSXLEN[0] == 64) {
        # immutable, always 2 (XLEN=64)
        return $bits(XRegWidth::XLEN64);
      } else {
        # mutable, undefined reset state
        return UNDEFINED_LEGAL;
      }
    sw_write(csr_value): |
      # VSXL keeps its value when VSXLEN is fixed, and on a write that is
      # reserved (0), selects XLEN=128 (3), or is wider than HSXLEN
      Bits<2> new_vsxl = vsxl_after_write(csr_value.VSXL);
      # Widening VSXLEN from 32 to 64 widens a mutable vsstatus.UXL to 64
      if ($array_size(VUXLEN) > 1) {
        CSR[vsstatus].UXL = vsstatus_uxl_after_vsxl_write(new_vsxl);
      }
      if (implemented?(ExtensionName::Ssnpm)) {
        if (($array_size(VSXLEN) > 1) && (new_vsxl == $bits(XRegWidth::XLEN32))) {
          # VS-mode at XLEN=32 also forces VU-mode to XLEN=32
          CSR[henvcfg].PMM = 0;
          CSR[hstatus].HUPMM = 0;
        }
      }
      return new_vsxl;
  HUKTE:
    location: 24
    long_name: Hypervisor UKTE
    description: |
      If the Svukte extension is implemented, the HUKTE field determines
      whether the HLV, HLVX, and HSV instructions, when executed in U-mode,
      are Svukte-qualified.
      When one of these instructions is executed in U-mode, it behaves as though
      `senvcfg`.UKTE were set to the value of HUKTE.
      If Svukte is not implemented, HUKTE is read-only zero.

    definedBy:
      extension:
        name: Svukte
    type: RW
    reset_value: UNDEFINED_LEGAL
  VTSR:
    location: 22
    long_name: Virtual Trap SRET
    description: |
      When `hstatus.VTSR` is set, executing the `sret` instruction in VS-mode
      raises a `Virtual Instruction` exception.

      When `hstatus.VTSR` is clear, an `sret` instruction in VS-mode returns control
      to the mode stored in `vsstatus.SPP`.
    type: RW
    reset_value: UNDEFINED_LEGAL
  VTW:
    location: 21
    long_name: Virtual Trap WFI
    description: |
      When `hstatus.VTW` is set, a `wfi` instruction executed in VS-mode raises
      a `Virtual Instruction` exception after waiting an implementation-defined
      amount of time (which can be 0).

      When both `hstatus.VTW` and `mstatus.TW` are clear, a `wfi` instruction
      executes in VS-mode without a timeout period.

      The `wfi` instruction is also affected by `mstatus.TW`, as shown below:

      [separator="!",%autowidth,%footer]
      !===
      .2+! [.rotate]#`mstatus.TW`# .2+! [.rotate]#`hstatus.VTW`# 4+^.>! `wfi` behavior
      h! HS-mode h! U-mode h! VS-mode h! VU-mode

      ! 0 ! 0 ! Wait ! Trap (I) ! Wait ! Trap (V)
      ! 0 ! 1 ! Wait ! Trap (I) ! Trap (V) ! Trap (V)
      ! 1 ! - ! Trap (I) ! Trap (I) ! Trap (I) ! Trap (I)

      6+! Trap (I) - Trap with `Illegal Instruction` code +
      Trap (V) - Trap with `Virtual Instruction` code
      !===
    type: RW
    reset_value: UNDEFINED_LEGAL
  VTVM:
    location: 20
    long_name: Virtual Trap Virtual Memory
    description: |
      When set, a 'Virtual Instruction` trap occurs when executing an `sfence.vma`, `sinval.vma`,
      or an explicit CSR access of the `satp` (really `vsatp`) register when in VS-mode.

      When clear, the instructions execute as normal in VS-mode.

      Notably, `hstatus.VTVM` does *not* cause `hfence.vvma`, `sfence.w.inval`, or `sfence.inval.ir` to trap.

      `mstatus.TVM` does not affect the VS-mode instructions controlled by `hstatus.VTVM`.
    type: RW
    reset_value: UNDEFINED_LEGAL
  VGEIN:
    location: 17-12
    long_name: Virtual Guest External Interrupt Number
    description: |
      Selects the guest external interrupt source for VS-level external interrupts.

      When `hstatus.VGEIN` == 0, no external interrupt source is selected.

      When `hstatus.VGEIN` != 0, it selects which bit of `hgeip` is currently active in VS-mode.

    type(): |
      # if NUM_EXTERNAL_GUEST_INTERRUPTS+1 is 63 (because indexing in `hgeip` starts at 1),
      # then the field accepts any value.
      # Otherwise, it accepts a restricted set of values
      if (NUM_EXTERNAL_GUEST_INTERRUPTS == 63) {
        return CsrFieldType::RW;
      } else {
        return CsrFieldType::RWR;
      }
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      if (csr_value.VGEIN <= NUM_EXTERNAL_GUEST_INTERRUPTS) {
        return csr_value.VGEIN;
      } else {
        return ILLEGAL_WLRL;
      }
  HU:
    location: 9
    long_name: Hypervisor in U-mode
    description: |
      When set, the hypervisor load/store instructions (`hlv`, `hlvx`, and `hsv`) can be
      executed in U-mode.

      When clear, the hypervisor load/store instructions cause an `Illegal Instruction` trap.
    type: RW
    reset_value: UNDEFINED_LEGAL
  SPVP:
    location: 8
    long_name: Supervisor Previous Virtual Privilege
    description: |
      Written by hardware:

      * When taking a trap into HS-mode from VS-mode or VU-mode, `hstatus.SPVP` is written with the nominal privilege mode

      Notably, unlike its analog `mstatus.SPP`, `hstatus.SPVP` is *not* cleared when returning from a trap.

      Can also be written by software without immediate side-effect.

      Affects execution by:

      * Controls the effective privilege level applied to the hypervisor load/store instructions, `hlv`, `hlvx`, and `hsv`.
    type: RW
    reset_value: UNDEFINED_LEGAL
  SPV:
    location: 7
    long_name: Supervisor Previous Virtualization Mode
    description: |
      Written by hardware:

      * On a trap into HS-mode, hardware writes 1 when the prior mode was VS-mode or VU-mode, and 0 otherwise.

      Can also be written by software without immediate side-effect.

      Affects execution by:

      * When an `sret` instruction in executed in HS-mode or M-mode,
        control returns to VS-mode or VU-mode (as selected by `mstatus.SPP`) when
        `hstatus.SPV` is 1 and to HS-mode or U-mode otherwise.
    type: RW
    reset_value: UNDEFINED_LEGAL
  GVA:
    location: 6
    long_name: Guest Virtual Address
    description: |
      Written by hardware whenever a trap is taken into HS-mode:

      * Writes 1 when a trap causes a guest virtual address to be written into `stval` (`Breakpoint`, `* Address Misaligned`, `* Access Fault`, `* Page Fault`, or `* Guest-Page Fault`).
      * Writes 0 otherwise

      Does not affect execution.
    type: RW
    reset_value: UNDEFINED_LEGAL
  VSBE:
    location: 5
    long_name: VS-mode Big Endian
    description:
      - text: |
          Controls the endianness of data VS-mode (0 = little, 1 = big).
          Instructions are always little endian, regardless of the data setting.

      - text: |
          Since the CPU does not support big endian in VS-mode, this is hardwired to 0.
        when(): return VS_MODE_ENDIANNESS == "little";

      - text: |
          Since the CPU does not support little endian in VS-mode, this is hardwired to 1.
        when(): return VS_MODE_ENDIANNESS == "big";

    type(): |
      if (VS_MODE_ENDIANNESS == "dynamic") {
        # mode is mutable
        return CsrFieldType::RW;
      } else {
        # mode is fixed as either little or big endian
        return CsrFieldType::RO;
      }
    reset_value(): |
      if (VS_MODE_ENDIANNESS == "little") {
        # little endian
        return 0;
      } else if (VS_MODE_ENDIANNESS == "big") {
        # big endian
        return 1;
      } else {
        # mutable
        return UNDEFINED_LEGAL;
      }
