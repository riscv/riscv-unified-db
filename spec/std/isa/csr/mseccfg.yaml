# yaml-language-server: $schema=../../../schemas/csr_schema.json

$schema: "csr_schema.json#"
kind: csr
name: mseccfg
long_name: Machine Security Configuration
address: 0x747
writable: true
priv_mode: M
length: 64
description: Machine Security Configuration
definedBy:
  extension:
    allOf:
      - name: Sm
        version: ">= 1.12"
      - anyOf:
          - name: Zkr
          - name: Smmpm
          - name: Zicfilp
          - name: Smepmp
fields:
  USEED:
    location: 8
    type(): |
      return implemented?(ExtensionName::U) ? CsrFieldType::RW : CsrFieldType::RO;
    reset_value: 0
    description: Controls U-mode access to the `seed` CSR.
    definedBy:
      extension:
        name: Zkr
    sw_write(csr_value): |
      return implemented?(ExtensionName::U) ? csr_value.USEED : 0;
  SSEED:
    location: 9
    type(): |
      return implemented?(ExtensionName::S) ? CsrFieldType::RW : CsrFieldType::RO;
    reset_value: 0
    description: Controls S/HS-mode access to the `seed` CSR.
    definedBy:
      extension:
        name: Zkr
    sw_write(csr_value): |
      return implemented?(ExtensionName::S) ? csr_value.SSEED : 0;
