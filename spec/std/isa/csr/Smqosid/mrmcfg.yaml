# yaml-language-server: $schema=../../../../schemas/csr_schema.json
$schema: csr_schema.json#
kind: csr
name: mrmcfg
long_name: Machine-Mode Resource Management Configuration
address: 0x381
writable: true
priv_mode: M
length: MXLEN
definedBy:
  extension:
    name: Smqosid
description: |
  The mrmcfg register is an MXLEN-wide WARL read/write machine-mode CSR used to configure a Resource Control ID (RCID), Monitoring Counter ID (MCID), and a QoS Register Interface ID (QRID).
  The QRID, RCID, and MCID are WARL fields.

  The QRID, RCID, and MCID values accompany each request made with effective privilege mode equal to M by the hart to shared resource controllers.
  The QRID and RCID values are used to determine the resource allocations (e.g., cache occupancy limits, memory bandwidth limits, etc.) to enforce.
  The QRID and MCID values are used to identify a counter to monitor resource usage.

  A suggested reset value of 0 for the RCID and QRID fields within the mrmcfg register aligns with the default operational behavior of resource controllers, which is to associate all capacity and resources with RCID=0.
  This setup ensures a seamless initial state that conforms to expected default resource allocation policies.
  The reset value for the MCID field, being potentially implementation-defined, does not directly impact core functionality and may vary based on specific system requirements.
  The QRID is typically selected once at startup by the RDSM to designate the QRI utilized by the RDSM itself.

  When Smqosid is implemented, the configurations in the srmcfg CSR introduced by Ssqosid extension only apply to requests made with effective privilege modes less than M.
fields:
  RCID:
    location: 11-0
    type: RW
    long_name: Resource Control ID
    description: |
      The `RCID` is used to determine the resource allocations (e.g., cache occupancy limits,
      memory bandwidth limits, etc.) to enforce.
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      return csr_value.RCID & ((1 `<< RCID_WIDTH) - 1);
  MCID:
    location: 27-16
    type: RW
    long_name: Monitoring Counter ID
    description: |
      The `MCID` is used to identify a counter to monitor resource usage.
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      return csr_value.MCID & ((1 `<< MCID_WIDTH) - 1);
  QRID:
    location: 31-28
    type: RW
    long_name: QoS Register Interface ID
    description: |
      The `QRID` is used to identify a QoS Register Interface to monitor resource usage.
    reset_value: UNDEFINED_LEGAL
    sw_write(csr_value): |
      return csr_value.QRID & ((1 `<< QRID_WIDTH) - 1);
