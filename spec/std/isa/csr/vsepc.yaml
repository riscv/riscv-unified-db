# yaml-language-server: $schema=../../../schemas/csr_schema.json

$schema: "csr_schema.json#"
kind: csr
name: vsepc
long_name: Virtual Supervisor Exception Program Counter
address: 0x241
writable: true
virtual_address: 0x141
priv_mode: VS
length: VSXLEN
description: |
  Written with the PC of an instruction on an exception or interrupt taken in VS-mode.

  Also controls where the hart jumps on an exception return from VS-mode.
definedBy:
  extension:
    name: H
fields:
  PC:
    location_rv32: 31-0
    location_rv64: 63-0
    description: |
      When a trap is taken into VS-mode, `vsepc.PC` is written with the virtual address of the
      instruction that was interrupted or that encountered the exception.
      Otherwise, `vsepc.PC` is never written by the implementation, though it may be explicitly written
      by software.

      On an exception return from VS-mode (from the SRET instruction),
      control transfers to the virtual address read out of `vsepc.PC`.

      <%- if ext?(:Zca) && !(ext?(:C) && MUTABLE_MISA_C == true) -%>
      Because PCs are always halfword-aligned, bit 0 of `vsepc.PC` is always
      read-only 0.

      <%- elsif !ext?(:Zca) -%>
      Because PCs are always word-aligned, bits 1:0 of `vsepc.PC` are always
      read-only 0.

      <%- end -%>
      [when,"ext?(:C) && MUTABLE_MISA_C == true"]
      Bit 0 of `vsepc.PC` is always read-only 0.
      When `misa.C` is clear, bit 1 is masked to zero. Writes to bit 1 are still captured, and
      may be visible on the next read when `misa.C` is set.
    type: RW-RH
    sw_write(csr_value): |
      return csr_value.PC & (implemented?(ExtensionName::Zca) ? ~64'b1 : ~64'b11);
    reset_value: UNDEFINED_LEGAL
sw_read(): |
  if (!implemented?(ExtensionName::Zca) || (implemented?(ExtensionName::C) && MUTABLE_MISA_C && (CSR[misa].C == 1'b0))) {
    # IALIGN is 32, so bit 1 reads as zero
    return CSR[vsepc].PC & ~64'b11;
  } else {
    return CSR[vsepc].PC & ~64'b1;
  }
