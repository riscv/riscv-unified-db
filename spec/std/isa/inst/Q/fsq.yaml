# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: fsq
long_name: Floating-Point Store Quad-Precision
description: |
  The `fsq` instruction stores a quad-precision floating-point value in `fs2` to memory at address `xs1` + `imm`.
  It does not modify the bits being transferred; in particular, the payloads of non-canonical NaNs are preserved.

  `fsq` is only guaranteed to execute atomically if the effective address is naturally aligned and XLEN=128.
definedBy:
  extension:
    name: Q
assembly: fs2, imm(xs1)
encoding:
  match: "-----------------100-----0100111"
  variables:
    - name: imm
      location: 31-25|11-7
      sign_extend: true
    - name: fs2
      location: 24-20
    - name: xs1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
