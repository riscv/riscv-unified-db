# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: flq
long_name: Floating-Point Load Quad-Precision
description: |
  The `flq` instruction loads a quad-precision floating-point value from memory at address `xs1` + `imm` into floating-point register `fd`.
  It does not modify the bits being transferred; in particular, the payloads of non-canonical NaNs are preserved.

  `flq` is only guaranteed to execute atomically if the effective address is naturally aligned and XLEN=128.

definedBy:
  extension:
    name: Q
assembly: fd, imm(xs1)
encoding:
  match: "-----------------100-----0000111"
  variables:
    - name: imm
      location: 31-20
      sign_extend: true
    - name: xs1
      location: 19-15
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
