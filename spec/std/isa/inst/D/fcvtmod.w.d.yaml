# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvtmod.w.d
long_name: Floating-Point Convert Double-Precision to Word with Modulo
description: |
  The `fcvtmod.w.d` instruction always rounds towards zero. Bits 31:0 are taken from the rounded, unbounded
  two's complement result, then sign-extended to XLEN bits and written to integer register `xd`. ±∞ and
  NaN are converted to zero.

  Floating-point exception flags are raised the same as they would be for `fcvt.w.d` with the same input
  operand.

  This instruction is only provided if the D extension is implemented. It is encoded like `fcvt.w.d`, but
  with the `xs2` field set to 8 and the `rm` field set to 1 (RTZ). Other `rm` values are reserved.
definedBy:
  extension:
    allOf:
      - name: D
      - name: Zfa
assembly: xd, fs1, rm
encoding:
  match: 110000101000-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
      not: [0, 2, 3, 4, 5, 6, 7]
      encode(operands): |
        if (operands[rm] == "rne") {
          return 3'b000;
        }
        if (operands[rm] == "rtz") {
          return 3'b001;
        }
        if (operands[rm] == "rdn") {
          return 3'b010;
        }
        if (operands[rm] == "rup") {
          return 3'b011;
        }
        if (operands[rm] == "rmm") {
          return 3'b100;
        }
        if (operands[rm] == "dyn") {
          return 3'b111;
        }
        raise(`Invalid rounding mode: ${operands[rm]}`);
      decode(): |
        if (rm == 0'b000) {
          return "rne";
        }
        if (rm == 0'b001) {
          return "rtz";
        }
        if (rm == 0'b010) {
          return "rdn";
        }
        if (rm == 0'b011) {
          return "rup";
        }
        if (rm == 0'b100) {
          return "rmm";
        }
        if (rm == 0'b111) {
          return "dyn";
        }
    - name: xd
      location: 11-7
operands:
  - name: xd
    type: register
    regfile: gpr
    source: false
    destination: true
  - name: fs1
    type: register
    regfile: fpr
  - name: rm
    type: rounding_mode
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
