# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fadd.d
long_name: Floating-Point Add Double-Precision
definedBy:
  extension:
    oneOf:
      - name: D
      - name: Zdinx
description: |
  The `fadd.d` instruction is analogous to `fadd.s` and performs double-precision floating-point addition of
  `fs1` and `fs2` and writes the final result to `fd`.
assembly: fd, fs1, fs2, rm
operands:
  - $inherits: operand/fd.yaml#/data
  - $inherits: operand/fs.yaml#/data
    name: fs1
  - $inherits: operand/fs.yaml#/data
    name: fs2
  - $inherits: operand/rm.yaml#/data
encoding:
  match: 0000001------------------1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
      encode(operands): |
        if (operands[rm] == "rne") {
          return 3b'000;
        } else if (operands[rm] == "rtz") {
          return 3b'001;
        } else if (operands[rm] == "rdn") {
          return 3b'010;
        } else if (operands[rm] == "rup") {
          return 3b'011;
        } else if (operands[rm] == "rmm") {
          return 3b'100;
        } else if (operands[rm] == "dyn") {
          return 3b'111;
        } # else reserved
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
