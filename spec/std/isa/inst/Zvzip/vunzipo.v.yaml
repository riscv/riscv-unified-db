# yaml-language-server: $schema=../../../../schemas/inst_schema.json
$schema: "inst_schema.json#"
kind: instruction
name: vunzipo.v
long_name: Vector unzip odd
description: |
  Extracts the odd-indexed elements of source vector register group `vs2`,
  with EMUL=2*LMUL, into destination `vd`, with EMUL=LMUL. For destination
  element index `i`, `vd[i] = vs2[2*i+1]`. The source is read at indices below
  `2*vl`; as for `vslidedown` and `vrgather`, source reads are not bounded by
  `vl`, so the source must hold `2*vl` valid elements.

  Masking, prestart, body, and tail element handling follow the base
  specification, applied to the destination element indices.

  An illegal-instruction exception is raised when LMUL=8.

  The destination vector register group may overlap the source vector register
  group only if `vd` equals `vs2`, as for narrowing instructions. Any other
  overlapping encoding raises an illegal-instruction exception.
definedBy:
  extension:
    name: Zvzip
assembly: vd, vs2, vm
encoding:
  match: 010010------01111010-----1010111
  variables:
    - name: vm
      location: 25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
