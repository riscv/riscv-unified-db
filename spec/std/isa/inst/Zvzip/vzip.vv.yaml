# yaml-language-server: $schema=../../../../schemas/inst_schema.json
$schema: "inst_schema.json#"
kind: instruction
name: vzip.vv
long_name: Vector zip
description: |
  Interleaves the elements of source vector register groups `vs2` and `vs1`,
  each with EMUL=LMUL/2, into destination `vd` with EMUL=LMUL. For destination
  element index `i`, even indices read `vs2[i/2]` and odd indices read
  `vs1[i/2]`, producing `vd = [vs2[0], vs1[0], vs2[1], vs1[1], ...]`. When
  `vl` is odd, `vs2` supplies one more element than `vs1`.

  Masking, prestart, body, and tail element handling follow the base
  specification, applied to the destination element indices.

  An illegal-instruction exception is raised when `2*SEW > LMUL*ELEN`, i.e.
  when SEW is too large for a source operand with EMUL=LMUL/2.

  A source vector register group may overlap the destination vector register
  group only if it is the highest-numbered half of the destination register
  group (which requires LMUL>=2), as for widening instructions. Any other
  overlapping encoding raises an illegal-instruction exception.
definedBy:
  extension:
    name: Zvzip
assembly: vd, vs2, vs1, vm
encoding:
  match: 111110-----------010-----1010111
  variables:
    - name: vm
      location: 25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
