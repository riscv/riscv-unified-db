# yaml-language-server: $schema=../../../../schemas/inst_schema.json
$schema: "inst_schema.json#"
kind: instruction
name: vpairo.vv
long_name: Vector pair odd
description: |
  Interleaves the odd-indexed elements of two source vector register groups
  into the destination. All operands have EMUL=LMUL. For destination element
  index `i`, `vd[i] = vs2[i+1]` if `i` is even and `vd[i] = vs1[i]` if `i` is
  odd, producing `vd = [vs2[1], vs1[1], vs2[3], vs1[3], ...]`. If `vl` is odd,
  the result for element `vl-1` is 0 and `vs2[vl]` is not read, which keeps
  the result independent of register contents at or above `vl`.

  Masking, prestart, body, and tail element handling follow the base
  specification, applied to the destination element indices.

  The destination vector register group cannot overlap either source vector
  register group; an overlapping encoding raises an illegal-instruction
  exception.
definedBy:
  extension:
    name: Zvzip
assembly: vd, vs2, vs1, vm
encoding:
  match: 001111-----------010-----1010111
  variables:
    - name: vm
      location: 25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
