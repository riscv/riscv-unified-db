# yaml-language-server: $schema=../../../../schemas/inst_schema.json
$schema: "inst_schema.json#"
kind: instruction
name: vpaire.vv
long_name: Vector pair even
description: |
  Interleaves the even-indexed elements of two source vector register groups
  into the destination. All operands have EMUL=LMUL. For destination element
  index `i`, `vd[i] = vs2[i]` if `i` is even and `vd[i] = vs1[i-1]` if `i` is
  odd, producing `vd = [vs2[0], vs1[0], vs2[2], vs1[2], ...]`.

  Masking, prestart, body, and tail element handling follow the base
  specification, applied to the destination element indices.

  The destination vector register group cannot overlap either source vector
  register group; an overlapping encoding raises an illegal-instruction
  exception.
definedBy:
  extension:
    name: Zvzip
assembly: vd, vs2, vs1, vm
encoding:
  match: 001111-----------000-----1010111
  variables:
    - name: vm
      location: 25
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
