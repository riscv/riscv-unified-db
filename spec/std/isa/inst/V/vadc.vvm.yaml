# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vadc.vvm
long_name: "Vector integer add-with-carry-in vector"
description: |
  Add each element from vector register vs2 to the respective element from vector register vs1 and the respective carry-in from vector register v0, and write the result to vector register vd. `vd[i] = vs2[i] + vs1[i] + v0.mask[i]`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, v0
encoding:
  match: 0100000----------000-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  check_masked_vector_register_overlap(1'b0, vd, $encoding);
  check_vector_register_group(vd, $encoding);
  check_vector_register_group(vs2, $encoding);
  check_vector_register_group(vs1, $encoding);

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    Bits<1> carry_in = V[0][i];
    V[vd + reg_off][end_bit:start_bit] = V[vs2 + reg_off][end_bit:start_bit] + V[vs1 + reg_off][end_bit:start_bit] + carry_in;
  }

  CSR[vstart].VALUE = 0;
