# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmsbc.vx
long_name: "Vector integer subtract-with-borrow-out scalar"
description: |
  Subtract from each element of vector register vs2 the scalar register xs1, and write the respective borrow-out to mask register vd. There is no borrow-in. The borrow is defined to be 1 iff the difference, prior to truncation, is negative. `vd.mask[i] = borrow_out(vs2[i] - x[xs1])`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1
encoding:
  match: 0100111----------100-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  Bits<ELEN> sext_xs1 = $signed(X[xs1]);

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    Bits<ELEN> vs2_val = V[vs2 + reg_off][end_bit:start_bit];
    Bits<ELEN> xs1_val = sext_xs1[state.sew-1:0];
    V[vd][i] = (vs2_val < xs1_val) ? 1'b1 : 1'b0;
  }

  CSR[vstart].VALUE = 0;
