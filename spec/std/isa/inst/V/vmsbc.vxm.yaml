# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmsbc.vxm
long_name: "Vector integer subtract-with-borrow-in-out scalar"
description: |
  Subtract from each element of vector register vs2 the scalar register xs1 and the respective borrow-in from vector register v0, and write the respective borrow-out to mask register vd. The borrow is defined to be 1 iff the difference, prior to truncation, is negative. `vd.mask[i] = borrow_out(vs2[i] - x[xs1] - v0.mask[i])`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, v0
encoding:
  match: 0100110----------100-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
