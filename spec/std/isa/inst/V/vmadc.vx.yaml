# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmadc.vx
long_name: "Vector integer add-with-carry-out scalar"
description: |
  Add each element from vector register vs2 to the scalar register xs1, and write the respective carry-out to mask register vd. There is no carry-in. `vd.mask[i] = carry_out(vs2[i] + x[xs1])`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1
encoding:
  match: 0100011----------100-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();
  Bits<ELEN> sext_xs1 = $signed(X[xs1]);

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    Bits<ELEN> a = V[vs2 + reg_off][end_bit:start_bit];
    Bits<ELEN> b = sext_xs1[state.sew-1:0];
    if (state.sew == 64) {
      Bits<ELEN> sum = a + b;
      V[vd][i] = (sum < a) ? 1'b1 : 1'b0;
    } else {
      Bits<ELEN> sum = a + b;
      V[vd][i] = (sum[state.sew:state.sew] != 0) ? 1'b1 : 1'b0;
    }
  }

  CSR[vstart].VALUE = 0;
