# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vwmaccus.vx
long_name: "Vector Widening Integer Multiply-Add Unsigned-Signed with Scalar"
description: |
  Widen and multiply unsigned elements from scalar register xs1 by signed elements from vector register vs2 to produce a double-width product, add the product to the double-width elements of vector register vd, and store results in vector register vd, using vector mask vm.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, xs1, vs2, vm
encoding:
  match: 111110-----------110-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
