# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vslidedown.vx
long_name: "Vector slide down by scalar offset"
description: |
  Slides elements in vector register vs2 down by the unsigned offset in scalar register xs1, so that
  vd[i] = vs2[i+offset], and stores results in vector register vd, using vector mask vm. Source
  elements at or beyond VLMAX read as zero; no scalar value is inserted.
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, xs1, vm
encoding:
  match: 001111-----------100-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
