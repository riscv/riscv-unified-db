# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmsbc.vvm
long_name: "Vector integer subtract-with-borrow-in-out vector"
description: |
  Subtract from each element of vector register vs2 the respective element from vector register vs1 and the respective borrow-in from vector register v0, and write the respective borrow-out to mask register vd. The borrow is defined to be 1 iff the difference, prior to truncation, is negative. `vd.mask[i] = borrow_out(vs2[i] - vs1[i] - v0.mask[i])`
definedBy:
  extension:
    name: Zvl32b
assembly: vd, vs2, vs1, v0
encoding:
  match: 0100110----------000-----1010111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  VectorState state = vector_state();

  U32 elems_per_reg = VLEN >> state.log2_sew;
  for (U32 i = CSR[vstart].VALUE; i < CSR[vl].VALUE; i++) {
    U32 reg_off = i / elems_per_reg;
    U32 start_bit = (i % elems_per_reg) * state.sew;
    U32 end_bit = start_bit + state.sew - 1;
    XReg borrow_in = V[0][i];
    XReg vs2_val = V[vs2 + reg_off][end_bit:start_bit];
    XReg vs1_val = V[vs1 + reg_off][end_bit:start_bit];
    XReg sub1 = vs1_val + borrow_in;
    V[vd][i] = (vs2_val < sub1 || (borrow_in == 1'b1 && vs1_val == {state.sew{1'b1}})) ? 1'b1 : 1'b0;
  }

  CSR[vstart].VALUE = 0;
