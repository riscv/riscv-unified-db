# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: c.lw
long_name: Load word
description: |
  Loads a 32-bit value from memory into register xd.
  It computes an effective address by adding the zero-extended offset, scaled by 4,
  to the base address in register xs1.
  It expands to `lw` `xd, offset(xs1)`.
definedBy:
  extension:
    name: Zca
assembly: xd, imm(xs1)
encoding:
  match: 010-----------00
  variables:
    - name: imm
      location: 5|12-10|6
      left_shift: 2
      encode(operands): |
        return operands[xs1].offset;
    - name: xd
      location: 4-2
      encode(operands): |
        return reg2creg(operands[xd]);
      decode(): |
        return creg2reg(xd);
    - name: xs1
      location: 9-7
      encode(operands): |
        return reg2creg(operands[xs1]);
      decode(): |
        return creg2reg(xd);
operands:
  - name: xd
    type: register
    reg_file: gpr
    source: false
    destination: true
    possible_values: [8, 9, 10, 11, 12, 13, 14, 15]
  - name: xs1
    type: register
    reg_file: gpr
    possible_values: [8, 9, 10, 11, 12, 13, 14, 15]
    offset:
      name: imm
      type: unsigned
      length: 5
      left_shifted: 2
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  if (implemented?(ExtensionName::C) && (CSR[misa].C == 1'b0)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  XReg virtual_address = X[creg2reg(xs1)] + imm;

  X[creg2reg(xd)] = sext(read_memory(32, virtual_address, $encoding), 32);
