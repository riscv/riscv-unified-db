# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsm3me.vv
long_name: Vector SM3 message expansion
description: |
  Performs eight rounds of SM3 message expansion. The sixteen most recent 32-bit message words are read as two eight-element groups from vs1 and vs2, and the next eight 32-bit message words are written to vd as an eight-element group.
definedBy:
  extension:
    name: Zvksh
assembly: vd, vs2, vs1
encoding:
  match: 1000001----------010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
