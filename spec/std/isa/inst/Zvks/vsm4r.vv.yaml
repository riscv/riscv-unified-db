# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsm4r.vv
long_name: Vector SM4 rounds
description: |
  Performs four rounds of SM4 encryption or decryption. The four words of current state are read as a four-element group from vd, and the round keys are read from the corresponding four-element group in vs2. The next four words of state are written to vd.
definedBy:
  extension:
    anyOf:
      - name: Zvks
      - name: Zvksed
assembly: vd, vs2
encoding:
  match: 1010001-----10000010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
