# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsm3c.vi
long_name: Vector SM3 compression
description: |
  Performs two rounds of SM3 compression. The current state of eight 32-bit words is read as an element group from vd, and eight 32-bit message words are read as an element group from vs2, of which only four are used. The next state of eight 32-bit words is written to vd. The 5-bit imm gives the round group, 0-31, that selects which two rounds are performed; for example, imm=1 performs rounds 2 and 3.
definedBy:
  extension:
    name: Zvksh
assembly: vd, vs2, imm
encoding:
  match: 1010111----------010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
