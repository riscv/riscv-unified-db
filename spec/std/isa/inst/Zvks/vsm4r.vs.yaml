# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsm4r.vs
long_name: Vector SM4 rounds with scalar round keys
description: |
  Performs four rounds of SM4 encryption or decryption. The four words of current state are read as a four-element group from vd, and the round keys are read from the scalar element group in vs2, which is used for every element group. The next four words of state are written to vd.
definedBy:
  extension:
    name: Zvksed
assembly: vd, vs2
encoding:
  match: 1010011-----10000010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
