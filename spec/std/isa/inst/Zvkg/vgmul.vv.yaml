# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vgmul.vv
long_name: Vector multiply over GHASH Galois-field
description: |
  Multiplies the 128-bit element groups in vd (multiplier) and vs2 (multiplicand) over GF(2^128^) and writes the product to vd. The multiplication is a carry-less multiply of two 128-bit polynomials modulo the GHASH polynomial x^128^ + x^7^ + x^2^ + x + 1. This is the same as `vghsh.vv` with a zero cipher text block.
definedBy:
  extension:
    name: Zvkg
assembly: vd, vs2
encoding:
  match: 1010001-----10001010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
