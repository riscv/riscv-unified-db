# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vghsh.vv
long_name: Vector add-multiply over GHASH Galois-field
description: |
  Performs a single iteration of the GHASH algorithm. The current partial hash in vd is added to the cipher text block in vs1, and the sum is multiplied over GF(2^128^) by the hash subkey in vs2. The multiplication is a carry-less multiply of two 128-bit polynomials modulo the GHASH polynomial x^128^ + x^7^ + x^2^ + x + 1. The next partial hash is written to vd.
definedBy:
  extension:
    name: Zvkg
assembly: vd, vs2, vs1
encoding:
  match: 1011001----------010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
