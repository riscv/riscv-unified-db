# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: sha512sum0
long_name: SHA-2-512 Sum0
description: |
  Computes the SHA-2-512 compression-function Sum0 transform on RV64.
definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: Zknh
assembly: xd, xs1
encoding:
  match: 000100000100-----001-----0010011
  variables:
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  X[xd] = crypto_ror64(X[xs1], 28) ^ crypto_ror64(X[xs1], 34) ^ crypto_ror64(X[xs1], 39);
