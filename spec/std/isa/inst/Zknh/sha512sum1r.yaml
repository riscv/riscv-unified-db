# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: sha512sum1r
long_name: SHA-2-512 Sum1 for RV32
description: |
  Computes one half of the SHA-2-512 Sum1 transform on RV32. Reversing the
  source operands computes the other half.
definedBy:
  allOf:
    - xlen: 32
    - extension:
        name: Zknh
assembly: xd, xs1, xs2
encoding:
  match: 0101001----------000-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  X[xd] = (X[xs1] << 23) ^ (X[xs1] >> 14) ^ (X[xs1] >> 18) ^
          (X[xs2] >> 9) ^ (X[xs2] << 18) ^ (X[xs2] << 14);
