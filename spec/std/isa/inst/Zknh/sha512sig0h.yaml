# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: sha512sig0h
long_name: SHA-2-512 Sigma0 high half
description: |
  Computes the high 32 bits of the SHA-2-512 Sigma0 transform on RV32.
definedBy:
  allOf:
    - xlen: 32
    - extension:
        name: Zknh
assembly: xd, xs1, xs2
encoding:
  match: 0101110----------000-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  X[xd] = (X[xs1] >> 1) ^ (X[xs1] >> 7) ^ (X[xs1] >> 8) ^
          (X[xs2] << 31) ^ (X[xs2] << 24);
