# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: sha256sum0
long_name: SHA-2-256 Sum0
description: |
  Computes the SHA-2-256 compression-function Sum0 transform. On RV64, the
  32-bit result is sign-extended to `XLEN`.
definedBy:
  extension:
    name: Zknh
assembly: xd, xs1
encoding:
  match: 000100000000-----001-----0010011
  variables:
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  Bits<32> input = X[xs1][31:0];
  X[xd] = sext(crypto_ror32(input, 2) ^ crypto_ror32(input, 13) ^ crypto_ror32(input, 22), 32);
