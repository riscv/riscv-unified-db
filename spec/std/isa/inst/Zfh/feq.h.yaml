# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: feq.h
long_name: Floating-Point Equal Half-Precision
description: |
  The `feq.h` instruction writes 1 to `xd` if `fs1` and `fs2` are equal, and 0 otherwise.
  If either operand is NaN, the result is 0 (not equal). If either operand is a signaling NaN,
  the invalid flag is set. Positive zero is considered equal to negative zero.
definedBy:
  extension:
    oneOf:
      - name: Zfh
      - name: Zhinx
assembly: xd, fs1, fs2
encoding:
  match: 1010010----------010-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
