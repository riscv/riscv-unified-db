# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: flt.h
long_name: Floating-Point Less Than Half-Precision
description: |
  The `flt.h` instruction writes 1 to `xd` if `fs1` is less than `fs2`, and 0 otherwise.
  If either operand is NaN, the result is 0. If either operand is a NaN
  (signaling or quiet), the invalid flag is set.
definedBy:
  extension:
    oneOf:
      - name: Zfh
      - name: Zhinx
assembly: xd, fs1, fs2
encoding:
  match: 1010010----------001-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
