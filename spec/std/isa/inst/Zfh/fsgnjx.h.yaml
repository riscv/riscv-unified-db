# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fsgnjx.h
long_name: Floating-Point Sign-Inject XOR Half-Precision
description: |
  The `fsgnjx.h` instruction produces a half-precision result that takes all bits except the sign bit from _fs1_.
  The result's sign bit is the XOR of sign bits of _fs1_ and _fs2_, and the result is written to
  the destination register _fd_. Sign-injection instructions do not set floating-point exception flags, nor do they
  canonicalize NaNs.
definedBy:
  extension:
    oneOf:
      - name: Zfh
      - name: Zhinx
assembly: fd, fs1, fs2
encoding:
  match: 0010010----------010-----1010011
  variables:
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  Bits<16> a = f16_operand(F[fs1]);
  Bits<16> b = f16_operand(F[fs2]);
  F[fd] = f16_result({a[15] ^ b[15], a[14:0]});
  mark_f_state_dirty();
