# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: aes32esmi
long_name: AES middle round encryption instruction for RV32
description: |
  Selects one byte from `xs2`, applies the forward AES S-box and partial
  MixColumns transform, rotates it by the selected byte position, and XORs it
  with `xs1`.
definedBy:
  allOf:
    - xlen: 32
    - extension:
        name: Zkne
assembly: xd, xs1, xs2, bs
encoding:
  match: --10011----------000-----0110011
  variables:
    - name: bs
      location: 31-30
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  Bits<8> input = crypto_byte_select32(X[xs2][31:0], bs);
  Bits<32> mixed = crypto_aes_mixcolumn_byte_fwd(crypto_aes_sbox_fwd(input));
  X[xd] = sext(X[xs1][31:0] ^ crypto_rol32_by_byte(mixed, bs), 32);
