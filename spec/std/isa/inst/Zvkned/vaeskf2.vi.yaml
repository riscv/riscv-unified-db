# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vaeskf2.vi
long_name: Vector AES-256 forward key schedule
description: |
  Performs a single round of the forward AES-256 KeySchedule. The next round key is generated word by word from the previous round key element group in vd and the current round key element group in vs2, and is written to vd. The round number, which ranges from 2 to 14, comes from imm[3:0] and selects both the round constant and the function applied; imm[4] is ignored. The out-of-range imm[3:0] values 0-1 and 15 are mapped to in-range values by inverting imm[3].
definedBy:
  extension:
    name: Zvkned
assembly: vd, vs2, imm
encoding:
  match: 1010101----------010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: imm
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
