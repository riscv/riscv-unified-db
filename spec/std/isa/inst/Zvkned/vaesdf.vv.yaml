# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vaesdf.vv
long_name: Vector AES final-round decryption
description: |
  Performs a final-round AES block cipher decryption. The InvShiftRows and InvSubBytes steps are applied to each round state element group from vd, and the result is XORed with the round key in the corresponding element group in vs2. The new round state is written to vd.
definedBy:
  extension:
    name: Zvkned
assembly: vd, vs2
encoding:
  match: 1010001-----00001010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
