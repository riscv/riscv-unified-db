# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vaesem.vs
long_name: Vector AES middle-round encryption with scalar round key
description: |
  Performs a middle-round AES block cipher encryption. The SubBytes, ShiftRows, and MixColumns steps are applied to each round state element group from vd, and the result is XORed with the round key in the scalar element group in vs2, which is used for every element group. The new round state is written to vd.
definedBy:
  extension:
    name: Zvkned
assembly: vd, vs2
encoding:
  match: 1010011-----00010010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
