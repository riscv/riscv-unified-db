# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsha2ms.vv
long_name: Vector SHA-2 message schedule
description: |
  Performs four rounds of SHA-2 message schedule expansion (SHA-256 when SEW=32; SHA-512 when SEW=64, which requires Zvknhb). Eleven of the last 16 message schedule words, taken from vd (oldest), vs2, and vs1 (most recent), are processed to produce the next four message schedule words, which are written to vd.
definedBy:
  extension:
    name: Zvknha
assembly: vd, vs2, vs1
encoding:
  match: 1011011----------010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
