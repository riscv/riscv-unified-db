# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vsha2ch.vv
long_name: Vector SHA-2 two rounds of compression, high part
description: |
  Performs two rounds of SHA-2 compression (SHA-256 when SEW=32; SHA-512 when SEW=64, which requires Zvknhb). Two message schedule words from vs1 are processed with the eight words of current state held in vd and vs2 to produce four words of the next state, which are written to vd. `vsha2ch.vv` uses the two most significant message schedule words of the element group in vs1; `vsha2cl.vv` is identical except that it uses the two least significant.
definedBy:
  extension:
    name: Zvknha
assembly: vd, vs2, vs1
encoding:
  match: 1011101----------010-----1110111
  variables:
    - name: vs2
      location: 24-20
    - name: vs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
