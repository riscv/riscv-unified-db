# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: sspopchk.x5
long_name: Shadow Stack Pop and Check (x5)
description: |
  SSPOPCHK pops a value from the shadow stack and checks it against link
  register `x5`.

  This instruction uses the `mop.r.28` codepoint provided by Zimop.
definedBy:
  extension:
    name: Zicfiss
assembly: x5
encoding:
  match: "11001101110000101100000001110011"
  variables: []
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
