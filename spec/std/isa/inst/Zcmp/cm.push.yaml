# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: cm.push
long_name: Create function call stack frame
description: |
  Creates a stack frame: store `ra` and 0 to 12 saved registers to the stack frame, optionally allocate additional stack space.
  This instruction pushes (stores) the registers in `reg_list` to the memory below the stack pointer,
  and then creates the stack frame by decrementing the stack pointer by `stack_adj`.

  Restrictions on stack_adj:

  * it must be enough to store all of the listed registers
  * it must be a multiple of 16 (bytes):
  ** for RV32 the allowed values are: 16, 32, 48, 64, 80, 96, 112
  ** for RV64 the allowed values are: 16, 32, 48, 64, 80, 96, 112, 128, 144, 160
definedBy:
  extension:
    name: Zcmp
assembly: "{reg_list}, -stack_adj"
operands:
  RV32:
    - $inherits: operand/reg-list-rv32.yaml#/data
    - $inherits: operand/stack-adj-rv32.yaml#/data
    - $inherits: operand/sp.yaml#/data
  RV64:
    - $inherits: operand/reg-list-rv64.yaml#/data
    - $inherits: operand/stack-adj-rv64.yaml#/data
    - $inherits: operand/sp.yaml#/data
encoding:
  match: 10111000------10
  variables:
    - name: rlist
      location: 7-4
      not: [0, 1, 2, 3]
      encode(operands): |
        if (operands[reg_list] == "{ra}" || operands[reg_list] == "{x1}") {
          return 4;
        }
        if (operands[reg_list] == "{ra,s0}" || operands[reg_list] == "{x1,x8}") {
          return 5;
        }
        if (operands[reg_list] == "{ra,s0-s1}" || operands[reg_list] == "{x1,x8-x9}") {
          return 6;
        }
        if (xlen() > 32) {
          if (operands[reg_list] == "{ra,s0-s2}" || operands[reg_list] == "{x1,x8-x9,x18}") {
            return 7;
          }
          if (operands[reg_list] == "{ra,s0-s3}" || operands[reg_list] == "{x1,x8-x9,x18-x19}") {
            return 8;
          }
          if (operands[reg_list] == "{ra,s0-s4}" || operands[reg_list] == "{x1,x8-x9,x18-x20}") {
            return 9;
          }
          if (operands[reg_list] == "{ra,s0-s5}" || operands[reg_list] == "{x1,x8-x9,x18-x21}") {
            return 10;
          }
          if (operands[reg_list] == "{ra,s0-s6}" || operands[reg_list] == "{x1,x8-x9,x18-x22}") {
            return 11;
          }
          if (operands[reg_list] == "{ra,s0-s7}" || operands[reg_list] == "{x1,x8-x9,x18-x23}") {
            return 12;
          }
          if (operands[reg_list] == "{ra,s0-s8}" || operands[reg_list] == "{x1,x8-x9,x18-x24}") {
            return 13;
          }
          if (operands[reg_list] == "{ra,s0-s9}" || operands[reg_list] == "{x1,x8-x9,x18-x25}") {
            return 14;
          }
          if (operands[reg_list] == "{ra,s0-s11}" || operands[reg_list] == "{x1,x8-x9,x18-x27}") {
            return 15;
          }
        }
        raise(`Invalid reg_list: ${operands[reg_list]}`);
      decode(): |
        if (rlist == 4) {
          return "{x1}";
        }
        if (rlist == 5) {
          return "{x1,x8}";
        }
        if (rlist == 6) {
          return "{x1,x8-x9}";
        }
        if (rlist == 7) {
          return "{x1,x8-x9,x18}";
        }
        if (rlist == 8) {
          return "{x1,x8-x9,x18-x19}";
        }
        if (rlist == 9) {
          return "{x1,x8-x9,x18-x20}";
        }
        if (rlist == 10) {
          return "{x1,x8-x9,x18-x21}";
        }
        if (rlist == 11) {
          return "{x1,x8-x9,x18-x22}";
        }
        if (rlist == 12) {
          return "{x1,x8-x9,x18-x23}";
        }
        if (rlist == 13) {
          return "{x1,x8-x9,x18-x24}";
        }
        if (rlist == 14) {
          return "{x1,x8-x9,x18-x25}";
        }
        if (rlist == 15) {
          return "{x1,x8-x9,x18-x27}";
        }
        raise(`Invalid rlist: ${rlist}`);
    - name: spimm
      location: 3-2
      #left_shift: 4
      encode(operands): |
        XReg rlist = 0;
        if (operands[reg_list] == "{ra}" || operands[reg_list] == "{x1}") {
          rlist = 4;
        } else if (operands[reg_list] == "{ra,s0}" || operands[reg_list] == "{x1,x8}") {
          rlist = 5;
        } else if (operands[reg_list] == "{ra,s0-s1}" || operands[reg_list] == "{x1,x8-x9}") {
          rlist = 6;
        } else if (operands[reg_list] == "{ra,s0-s2}" || operands[reg_list] == "{x1,x8-x9,x18}") {
          rlist = 7;
        } else if (operands[reg_list] == "{ra,s0-s3}" || operands[reg_list] == "{x1,x8-x9,x18-x19}") {
          rlist = 8;
        } else if (operands[reg_list] == "{ra,s0-s4}" || operands[reg_list] == "{x1,x8-x9,x18-x20}") {
          rlist = 9;
        } else if (operands[reg_list] == "{ra,s0-s5}" || operands[reg_list] == "{x1,x8-x9,x18-x21}") {
          rlist = 10;
        } else if (operands[reg_list] == "{ra,s0-s6}" || operands[reg_list] == "{x1,x8-x9,x18-x22}") {
          rlist = 11;
        } else if (operands[reg_list] == "{ra,s0-s7}" || operands[reg_list] == "{x1,x8-x9,x18-x23}") {
          rlist = 12;
        } else if (operands[reg_list] == "{ra,s0-s8}" || operands[reg_list] == "{x1,x8-x9,x18-x24}") {
          rlist = 13;
        } else if (operands[reg_list] == "{ra,s0-s9}" || operands[reg_list] == "{x1,x8-x9,x18-x25}") {
          rlist = 14;
        } else if (operands[reg_list] == "{ra,s0-s11}" || operands[reg_list] == "{x1,x8-x9,x18-x27}") {
          rlist = 15;
        }

        if (rlist == 0) {
          raise(`Invalid reg_list: ${operands[reg_list]}`);
        }

        XReg registers = (rlist == 15) ? 13 : (rlist - 3);
        XReg bytes_per_register = xlen() / 8;
        XReg register_space_bytes = registers * bytes_per_register;
        XReg register_space_bytes_aligned_16 = ((register_space_bytes + 15) / 16) * 16;
        XReg additional_bytes = (-operands[stack_adj]) - register_space_bytes_aligned_16;
        return additional_bytes >> 4;
      decode(): |
        XReg additional_bytes = spimm << 4;
        XReg registers = (rlist == 15) ? 13 : (rlist - 3);
        XReg bytes_per_register = xlen() / 8;
        XReg register_space_bytes = registers * bytes_per_register;
        XReg register_space_bytes_aligned_16 = ((register_space_bytes + 15) / 16) * 16;
        return -(register_space_bytes_aligned_16 + additional_bytes);
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  if (implemented?(ExtensionName::Zcmp) && (CSR[misa].C == 1'b0)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  XReg size = xlen() / 8;
  XReg nreg = (rlist == 15) ? 13 : (rlist - 3);
  XReg stack_aligned_adj = (nreg * 4 + 15) & ~0xF;
  XReg virtual_address_sp = X[2];
  XReg virtual_address_new_sp = virtual_address_sp - stack_aligned_adj - spimm * 16;
  XReg virtual_address_base = virtual_address_sp - (nreg * size);

  write_memory_xlen_aligned(virtual_address_base +  0*size, X[ 1], $encoding);
  if (nreg > 1) {
    write_memory_xlen_aligned(virtual_address_base +  1*size, X[ 8], $encoding);
  }
  if (nreg > 2) {
    write_memory_xlen_aligned(virtual_address_base +  2*size, X[ 9], $encoding);
  }
  if (nreg > 3) {
    write_memory_xlen_aligned(virtual_address_base +  3*size, X[18], $encoding);
  }
  if (nreg > 4) {
    write_memory_xlen_aligned(virtual_address_base +  4*size, X[19], $encoding);
  }
  if (nreg > 5) {
    write_memory_xlen_aligned(virtual_address_base +  5*size, X[20], $encoding);
  }
  if (nreg > 6) {
    write_memory_xlen_aligned(virtual_address_base +  6*size, X[21], $encoding);
  }
  if (nreg > 7) {
    write_memory_xlen_aligned(virtual_address_base +  7*size, X[22], $encoding);
  }
  if (nreg > 8) {
    write_memory_xlen_aligned(virtual_address_base +  8*size, X[23], $encoding);
  }
  if (nreg > 9) {
    write_memory_xlen_aligned(virtual_address_base +  9*size, X[24], $encoding);
  }
  if (nreg > 10) {
    write_memory_xlen_aligned(virtual_address_base + 10*size, X[25], $encoding);
  }
  if (nreg > 11) {
    write_memory_xlen_aligned(virtual_address_base + 11*size, X[26], $encoding);
    write_memory_xlen_aligned(virtual_address_base + 12*size, X[27], $encoding);
  }

  X[2] = virtual_address_new_sp;
