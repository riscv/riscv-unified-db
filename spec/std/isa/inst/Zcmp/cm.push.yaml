# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: cm.push
long_name: Create function call stack frame
description: |
  Creates a stack frame: store `ra` and 0 to 12 saved registers to the stack frame, optionally allocate additional stack space.
  This instruction pushes (stores) the registers in `reg_list` to the memory below the stack pointer,
  and then creates the stack frame by decrementing the stack pointer by `stack_adj`.

  Restrictions on stack_adj:

  * it must be enough to store all of the listed registers
  * it must be a multiple of 16 (bytes):
  ** for RV32 the allowed values are: 16, 32, 48, 64, 80, 96, 112
  ** for RV64 the allowed values are: 16, 32, 48, 64, 80, 96, 112, 128, 144, 160
definedBy:
  extension:
    name: Zcmp
assembly: "{reg_list}, -stack_adj"
operands:
  RV32:
    - name: reg_range0
      type: reg_range
      possible_values: ["ra", "x1"]
    - name: reg_range1
      type: reg_range
      possible_values: ["s0", "x8", "s0-s1", "x8-x9"]
      optional: true
    - name: stack_adj
      type: immediate
      possible_values: [-16, -32, -48, -64, -80, -96, -112]
  RV64:
    - name: reg_range0
      type: reg_range
      possible_values: ["ra", "x1"]
    - name: reg_range1
      type: reg_range
      possible_values:
        [
          "s0",
          "x8",
          "s0-s1",
          "x8-x9",
          "s0-s2",
          "s0-s3",
          "s0-s4",
          "s0-s5",
          "s0-s6",
          "s0-s7",
          "s0-s8",
          "s0-s9",
          "s0-s11",
        ]
      optional: true
    - name: reg_range2
      type: reg_range
      possible_values:
        [
          "x18",
          "x18-x19",
          "x18-x20",
          "x18-x21",
          "x18-x22",
          "x18-x23",
          "x18-x24",
          "x18-x25",
          "x18-x27",
        ]
      optional: true
    - type: immediate
      name: stack_adj
      possible_values: [-16, -32, -48, -64, -80, -96, -112, -128, -144, -160]
encoding:
  match: 10111000------10
  variables:
    - name: rlist
      location: 7-4
      not: [0, 1, 2, 3]
      encode(operands): |
        if        (operands[reg_range0] == "ra" || operands[reg_range0] == "x1")
          &&      (operands[reg_range1] == "")
          &&      (operands[reg_range2] == "") {
          return 4;
        } else if (
                    (operands[reg_range0] == "ra" && operands[reg_range1] == "s0") ||
                    (operands[reg_range0] == "x1" && operands[reg_range1] == "x8")
                  )
          &&      (operands[reg_range2] == "") {
          return 5;
        } else if (
                    (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s1") ||
                    (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9")
                  )
          &&      (operands[reg_range2] == "") {
          return 6;
        } else if (xlen() > 32) {
          if (
               (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s2" && operands[reg_range2] == "") ||
               (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9" && operands[reg_range2] == "x18")
             ) {
            return 7;
          } else if (
               (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s3" && operands[reg_range2] == "") ||
               (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9" && operands[reg_range2] == "x18-x19")
             ) {
            return 8;
          } else if (
               (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s4" && operands[reg_range2] == "") ||
               (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9" && operands[reg_range2] == "x18-x20")
             ) {
            return 9;
          } else if (
               (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s5" && operands[reg_range2] == "") ||
               (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9" && operands[reg_range2] == "x18-x21")
             ) {
            return 10;
          } else if (
               (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s6" && operands[reg_range2] == "") ||
               (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9" && operands[reg_range2] == "x18-x22")
             ) {
            return 11;
          } else if (
               (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s7" && operands[reg_range2] == "") ||
               (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9" && operands[reg_range2] == "x18-x23")
             ) {
            return 12;
          } else if (
               (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s8" && operands[reg_range2] == "") ||
               (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9" && operands[reg_range2] == "x18-x24")
             ) {
            return 13;
          } else if (
               (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s9" && operands[reg_range2] == "") ||
               (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9" && operands[reg_range2] == "x18-x25")
             ) {
            return 14;
          } else if (
               (operands[reg_range0] == "ra" && operands[reg_range1] == "s0-s11" && operands[reg_range2] == "") ||
               (operands[reg_range0] == "x1" && operands[reg_range1] == "x8-x9" && operands[reg_range2] == "x18-x27")
             ) {
            return 15;
          }
        }
        raise(`Invalid reg_list: ${operands}`);
      decode(): |
        if (rlist) == 4) {
          return "ra";
        }
        if (rlist) == 5) {
          return "ra, s0";
        }
        if (rlist) == 6) {
          return "ra, s0-s1";
        }
        if (rlist) == 7) {
          return "ra, s0-s2";
        }
        if (rlist) == 8) {
          return "ra, s0-s3";
        }
        if (rlist) == 9) {
          return "ra, s0-s4";
        }
        if (rlist) == 10) {
          return "ra, s0-s5";
        }
        if (rlist) == 11) {
          return "ra, s0-s6";
        }
        if (rlist) == 12) {
          return "ra, s0-s7";
        }
        if (rlist) == 13) {
          return "ra, s0-s8";
        }
        if (rlist) == 14) {
          return "ra, s0-s9";
        }
        if (rlist) == 15) {
          return "ra, s0-s11";
        }
        raise(`Invalid rlist: ${rlist]}`);
    - name: spimm
      location: 3-2
      #left_shift: 4
      encode(operands): |
        Xreg registers = 0;
        if (operands[reg_range0] == "ra" || operands[reg_range0] == "x1") {
          registers = registers + 1;
          if (operands[reg_range1] == "s0" || operands[reg_range1] == "x8") {
            registers = registers + 1;
          } else if (operands[reg_range1] == "s0-s1") {
            registers = registers + 2;
          } else if (operands[reg_range1] == "s0-s2") {
            registers = registers + 3;
          } else if (operands[reg_range1] == "s0-s3") {
            registers = registers + 4;
          } else if (operands[reg_range1] == "s0-s4") {
            registers = registers + 5;
          } else if (operands[reg_range1] == "s0-s5") {
            registers = registers + 6;
          } else if (operands[reg_range1] == "s0-s6") {
            registers = registers + 7;
          } else if (operands[reg_range1] == "s0-s7") {
            registers = registers + 8;
          } else if (operands[reg_range1] == "s0-s8") {
            registers = registers + 9;
          } else if (operands[reg_range1] == "s0-s9") {
            registers = registers + 10;
          } else if (operands[reg_range1] == "s0-s9") {
            registers = registers + 11;
          } else if (operands[reg_range1] == "x8-x9") {
            registers = registers + 2;
            if (operands[reg_range2] == "x18") {
              registers = registers + 1;
            } else if (operands[reg_range2] == "x18-x19") {
              registers = registers + 2;
            } else if (operands[reg_range2] == "x18-x20") {
              registers = registers + 3;
            } else if (operands[reg_range2] == "x18-x21") {
              registers = registers + 4;
            } else if (operands[reg_range2] == "x18-x22") {
              registers = registers + 5;
            } else if (operands[reg_range2] == "x18-x23") {
              registers = registers + 6;
            } else if (operands[reg_range2] == "x18-x24") {
              registers = registers + 7;
            } else if (operands[reg_range2] == "x18-x25") {
              registers = registers + 8;
            } else if (operands[reg_range2] == "x18-x27") {
              registers = registers + 9;
            }
          }
        }
        XReg bytes_per_register = xlen() / 8;
        XReg register_space_bytes = registers * bytes_per_reg;
        XReg register_space_bytes_aligned_16 = ((register_space_bytes + 15) / 16) * 16;
        XReg additional_bytes = (-operands[stack_adj]) - register_space_bytes_aligned_16;
        return additional_bytes >> 4;
      decode(): |
        XReg additional_bytes = spimm << 4;
        XReg registers = rlist;
        XReg bytes_per_register = xlen() / 8;
        XReg register_space_bytes = registers * bytes_per_reg;
        XReg register_space_bytes_aligned_16 = ((register_space_bytes + 15) / 16) * 16;
        return -(register_space_bytes_aligned_16 + additional_bytes);
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  if (implemented?(ExtensionName::Zcmp) && (CSR[misa].C == 1'b0)) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  XReg size = xlen() / 8;
  XReg nreg = (rlist == 15) ? 13 : (rlist - 3);
  XReg stack_aligned_adj = (nreg * 4 + 15) & ~0xF;
  XReg virtual_address_sp = X[2];
  XReg virtual_address_new_sp = virtual_address_sp - stack_aligned_adj - spimm * 16;
  XReg virtual_address_base = virtual_address_sp - (nreg * size);

  write_memory_xlen_aligned(virtual_address_base +  0*size, X[ 1], $encoding);
  if (nreg > 1) {
    write_memory_xlen_aligned(virtual_address_base +  1*size, X[ 8], $encoding);
  }
  if (nreg > 2) {
    write_memory_xlen_aligned(virtual_address_base +  2*size, X[ 9], $encoding);
  }
  if (nreg > 3) {
    write_memory_xlen_aligned(virtual_address_base +  3*size, X[18], $encoding);
  }
  if (nreg > 4) {
    write_memory_xlen_aligned(virtual_address_base +  4*size, X[19], $encoding);
  }
  if (nreg > 5) {
    write_memory_xlen_aligned(virtual_address_base +  5*size, X[20], $encoding);
  }
  if (nreg > 6) {
    write_memory_xlen_aligned(virtual_address_base +  6*size, X[21], $encoding);
  }
  if (nreg > 7) {
    write_memory_xlen_aligned(virtual_address_base +  7*size, X[22], $encoding);
  }
  if (nreg > 8) {
    write_memory_xlen_aligned(virtual_address_base +  8*size, X[23], $encoding);
  }
  if (nreg > 9) {
    write_memory_xlen_aligned(virtual_address_base +  9*size, X[24], $encoding);
  }
  if (nreg > 10) {
    write_memory_xlen_aligned(virtual_address_base + 10*size, X[25], $encoding);
  }
  if (nreg > 11) {
    write_memory_xlen_aligned(virtual_address_base + 11*size, X[26], $encoding);
    write_memory_xlen_aligned(virtual_address_base + 12*size, X[27], $encoding);
  }

  X[2] = virtual_address_new_sp;
