# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vdot4au.vx
long_name: Vector 4-input unsigned dot product (vector-scalar)
description: |
  Vector 4-input unsigned dot product instruction performing the dot product between a 4-element vector of 8-bit unsigned integer elements (vs2) and a scalar 4-element vector of 8-bit unsigned integer elements (xs1), accumulating the result into a 32-bit unsigned integer accumulator.
  
  This instruction is only defined for SEW=32. It works on an element group with four 8-bit values stored together in a 32-bit bundle. For each input bundle for the dot product there is a corresponding (same index) SEW-wide element in the accumulator source (and destination).
  
  The "4" in the mnemonic indicates 4-input dot-product, and "a" indicates accumulate. The number of body bundles is determined by `vl`. The operation can be masked, each mask bit determines whether the corresponding element result is active or not.
  
  The operation performed is:
  ```
  vd[i] = unsigned(vs2[i][0]) * unsigned(xs1[0]) + unsigned(vs2[i][1]) * unsigned(xs1[1]) + unsigned(vs2[i][2]) * unsigned(xs1[2]) + unsigned(vs2[i][3]) * unsigned(xs1[3]) + vd[i]
  ```
definedBy:
  extension:
    name: Zvdot4a
assembly: vd, vs2, xs1, vm
encoding:
  match: 101000-----------110-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |

sail(): |
