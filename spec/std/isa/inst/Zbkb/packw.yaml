# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: packw
long_name: Pack low halfwords of registers
description: |
  Packs the low halfword of `xs1` into bits 15:0 and the low halfword of
  `xs2` into bits 31:16, then sign-extends the 32-bit result to `XLEN`.
definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: Zbkb
assembly: xd, xs1, xs2
encoding:
  match: 0000100----------100-----0111011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
pseudoinstructions:
  - when: (xs2 == 0x0)
    to: zext.h xd, xs1
operation(): |
  X[xd] = sext({X[xs2][15:0], X[xs1][15:0]}, 32);
