# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: pack
long_name: Pack low halves of registers
description: |
  Packs the low half of `xs1` into the low half of `xd` and the low half of
  `xs2` into the high half of `xd`.
definedBy:
  extension:
    name: Zbkb
assembly: xd, xs1, xs2
encoding:
  match: 0000100----------100-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
pseudoinstructions:
  - when: (xs2 == 0) && (xlen() == 32)
    to: zext.h xd, xs1
operation(): |
  if (xlen() == 32) {
    X[xd] = {X[xs2][15:0], X[xs1][15:0]};
  } else {
    X[xd] = {X[xs2][31:0], X[xs1][31:0]};
  }
