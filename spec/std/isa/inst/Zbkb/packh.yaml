# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: packh
long_name: Pack low bytes of registers
description: |
  Packs the low byte of `xs1` into bits 7:0 of `xd` and the low byte of
  `xs2` into bits 15:8; all remaining bits of `xd` are zero.
definedBy:
  extension:
    name: Zbkb
assembly: xd, xs1, xs2
encoding:
  match: 0000100----------111-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  if (xlen() == 32) {
    X[xd] = {16'b0, X[xs2][7:0], X[xs1][7:0]};
  } else {
    X[xd] = {48'b0, X[xs2][7:0], X[xs1][7:0]};
  }
