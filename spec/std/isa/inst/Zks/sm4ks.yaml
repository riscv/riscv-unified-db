# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: sm4ks
long_name: No synopsis available
description: |
  No description available.
definedBy:
  extension:
    name: Zksed
assembly: xd, xs1, xs2, bs
encoding:
  match: --11010----------000-----0110011
  variables:
    - name: bs
      location: 31-30
      encode(operands): return operands[bs].value;
    - name: xs2
      location: 24-20
      encode(operands): return operands[xs2].value;
    - name: xs1
      location: 19-15
      encode(operands): return operands[xs1].value;
    - name: xd
      location: 11-7
      encode(operands): return operands[xd].value;
operands:
  - name: xd
    type: register
    reg_file: gpr
    source: false
    destination: true
    decode(): return xd;
  - name: xs1
    type: register
    reg_file: gpr
    source: true
    destination: false
    decode(): return xs1;
  - name: xs2
    type: register
    reg_file: gpr
    source: true
    destination: false
    decode(): return xs2;
  - name: bs
    type: immediate
    possible_values: 0-3
    decode(): return bs;
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
