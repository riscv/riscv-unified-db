# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: sm3p0
long_name: SM3 P0 transform
description: |
  Computes the P0 permutation used by the SM3 hash function. On RV64, the
  32-bit result is sign-extended to `XLEN`.
definedBy:
  extension:
    name: Zksh
assembly: xd, xs1
encoding:
  match: 000100001000-----001-----0010011
  variables:
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  Bits<32> input = X[xs1][31:0];
  X[xd] = sext(input ^ crypto_rol32(input, 9) ^ crypto_rol32(input, 17), 32);
