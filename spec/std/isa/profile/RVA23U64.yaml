# yaml-language-server: $schema=../../../schemas/profile_schema.json

$schema: profile_schema.json#
kind: profile
name: RVA23U64
long_name: U-mode extensions for version 23 of the 64-bit Apps Processor profile
marketing_name: RVA23U64
mode: U
base: 64
release: { $ref: profile_release/RVA23.yaml# }
introduction: |
  The RVA23U64 profile specifies the ISA features available to user-mode
  execution environments in 64-bit applications processors.  This is the
  most important profile within application processors in
  terms of the amount of software that targets this profile.
extensions:
  #########################################################################
  # imported from RVB23U64
  #########################################################################
  $inherits: "profile/RVB23U64.yaml#/extensions"
  $remove:
    - Zvkg
    - Zvknc
    - Zvksc
    - Zkn
    - Zks

  #########################################################################
  # MANDATORY extensions in RVA23U64 (that were optional in RVB23U64)
  #########################################################################

  Zfhmin:
    presence: mandatory
    version: ~> 1.0

  V:
    presence: mandatory
    version: ~> 1.0

  Zve64d:
    presence: mandatory
    version: ~> 1.0

  Zve64f:
    presence: mandatory
    version: ~> 1.0

  Zve64x:
    presence: mandatory
    version: ~> 1.0

  Zve32f:
    presence: mandatory
    version: ~> 1.0

  Zve32x:
    presence: mandatory
    version: ~> 1.0

  Zvl128b:
    presence: mandatory
    version: ~> 1.0

  Zvl64b:
    presence: mandatory
    version: ~> 1.0

  Zvl32b:
    presence: mandatory
    version: ~> 1.0

  Zvfhmin:
    presence: mandatory
    version: ~> 1.0

  Zvbb:
    presence: mandatory
    version: ~> 1.0

  Zvkb:
    presence: mandatory
    version: ~> 1.0

  Zvkt:
    presence: mandatory
    version: ~> 1.0

  Supm:
    presence: mandatory
    version: ~> 1.0

  #--------------------------------------------
  # Zvbc is an expansion option in RVB23U64
  # (but is not intended to be made mandatory in future RVB Profiles)
  #
  # It is listed in RVA23U64 as a *development* option,
  # as it *is* intended to become mandatory in future RVA Profiles.
  #--------------------------------------------
  Zvbc:
    presence:
      optional: development
    version: ~> 1.0

  #########################################################################
  # TRANSITORY EXPANSION extensions in RVA23U64
  #########################################################################

  #--------------------------------------------
  # (there are no Transitory expansion options in RVA23U64)
  #--------------------------------------------

requirements:
  param:
    allOf:
      - name: VLEN
        greaterThanOrEqual: 128
      - name: U_MODE_ENDIANNESS
        equal: little
      - name: MISALIGNED_LDST
        equal: true
      - name: MTVEC_BASE_ALIGNMENT_DIRECT
        equal: 4
      - name: MTVEC_MODES
        equal: [0, 1]
      - name: PRECISE_SYNCHRONOUS_EXCEPTIONS
        equal: true
      - name: TRAP_ON_ECALL_FROM_M
        equal: true
      - name: TRAP_ON_EBREAK
        equal: true
      - name: REPORT_VA_IN_MTVAL_ON_BREAKPOINT
        equal: true
      - name: REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT
        equal: true
      - name: REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT
        equal: true
      - name: REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT
        equal: true
      - name: REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION
        equal: true
      - name: M_MODE_ENDIANNESS
        equal: little
      - name: MXLEN
        equal: 64
      - name: NUM_PMP_ENTRIES
        greaterThanOrEqual: 4
      - name: PMP_GRANULARITY
        lessThanOrEqual: 12
