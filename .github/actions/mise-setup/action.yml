name: mise setup
description: Set up mise environment and install Ruby gems, Python packages, and npm packages
inputs:
  toolchain:
    description: Whether to pull/build the RISC-V toolchain container (for C++ jobs)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
    - name: Cache bundler gems
      uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: bundler-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'tools/ruby-gems/*/Gemfile.lock') }}
    - name: Set bundler PATH
      shell: bash
      run: bundle config set --local path 'vendor/bundle'
    - name: Install Ruby gems
      shell: bash
      run: bundle install --jobs $(nproc)
    - name: Cache uv packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
    - name: Install Python packages
      shell: bash
      run: uv sync
    - name: Cache npm packages
      uses: actions/cache@v4
      with:
        path: node_modules
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install npm packages
      shell: bash
      run: npm ci
    - name: Pull or build RISC-V toolchain container
      if: inputs.toolchain == 'true'
      shell: bash
      run: |
        ./bin/chore container pull -t toolchain || \
        ./bin/chore container build -t toolchain
