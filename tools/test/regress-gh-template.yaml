name: CI/CD

permissions:
  contents: read
  pull-requests: write
  packages: read

on:
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEPLOY_DIR: _site
  GITHUB_TOKEN: ${{ github.token }}

# cancel any prior actions from the same PR that are still running (we only care about the final commit)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  never-runs:
    # this just exists so that renovate can keep action version pointers up-to-date
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Use download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      - name: Use upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: .

  regress-pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # there are some symlinks in udb-gen that look broken without submodules
        with:
          submodules: true
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2

  regress-llvm:
    runs-on: ubuntu-latest
    needs: [build-llvm]
    steps:
      - name: Clone Github Repo Action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: Get current LLVM submodule commit SHA
        id: get-llvm-sha
        run: echo "LLVM_SHA=$(git ls-tree HEAD ext/llvm-project | awk '{print $3}')" >> "$GITHUB_ENV"
      - name: Restore cache RISC-V JSON
        id: cache-riscv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/llvm-project/riscv.json
          key: ${{ runner.os }}-riscv-json-${{ env.LLVM_SHA }}
      - name: Test LLVM
        run: ./do test:llvm

  regress-find-configs:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.configs.outputs.configs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Find configuration files
        id: configs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          configs = sorted(path.stem for path in Path("cfgs").glob("*.yaml"))
          print("configs=" + json.dumps(configs))
          PY

  regress-udb-cov-report:
    runs-on: ubuntu-latest
    needs: [regress-udb-unit-test]
    steps:
      - name: Clone Github Repo Action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up mise environment
        uses: ./.github/actions/mise-setup
      - name: download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: udb-*-cov
          path: _cov/udb
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Collate coverage
        run: ./do chore:udb:collate_cov[_cov/udb]
      - name: Upload udb coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: tools/ruby-gems/udb/coverage/coverage.xml
          flags: udb

  build-llvm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (no submodules, shallow fetch)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false
          fetch-depth: 1
      - name: Get current LLVM submodule commit SHA
        id: get-llvm-sha
        run: echo "LLVM_SHA=$(git ls-tree HEAD ext/llvm-project | awk '{print $3}')" >> "$GITHUB_ENV"
      - name: Cache RISC-V JSON
        id: cache-riscv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ext/llvm-project/riscv.json
          key: ${{ runner.os }}-riscv-json-${{ env.LLVM_SHA }}
      - name: Initialize LLVM submodule (shallow + sparse)
        if: ${{ steps.cache-riscv.outputs.cache-hit != 'true' }}
        run: |
          rm -rf ext/llvm-project
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1 ext/llvm-project
      - name: Check for required directories and files
        if: ${{ steps.cache-riscv.outputs.cache-hit != 'true' }}
        run: |
          ls -l ext/llvm-project/llvm/include
          ls -l ext/llvm-project/llvm/lib/Target/RISCV
          ls -l ext/llvm-project/llvm/lib/Target/RISCV/RISCV.td
      - name: Configure and build llvm-tblgen
        if: ${{ steps.cache-riscv.outputs.cache-hit != 'true' }}
        run: |
          cmake -S ext/llvm-project/llvm -B ext/llvm-project/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ext/llvm-project/build --target llvm-tblgen
      - name: Generate RISC-V JSON
        if: ${{ steps.cache-riscv.outputs.cache-hit != 'true' }}
        run: |
          chmod +x ./ext/llvm-project/build/bin/llvm-tblgen
          ./ext/llvm-project/build/bin/llvm-tblgen \
            -I ext/llvm-project/llvm/include \
            -I ext/llvm-project/llvm/lib/Target/RISCV \
            ext/llvm-project/llvm/lib/Target/RISCV/RISCV.td \
            --dump-json \
            -o ext/llvm-project/riscv.json
      - name: Show riscv.json output
        run: ls -l ext/llvm-project/riscv.json
      - name: Upload RISC-V JSON as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: riscv-json
          path: ext/llvm-project/riscv.json

  java-tests:
    name: Java (Xtext) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/eclipse/dev/org.xtext.udb.parent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Temurin JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test (whole reactor)
        working-directory: tools/eclipse/dev/org.xtext.udb.parent
        env:
          MAVEN_OPTS: "-Djdk.xml.maxGeneralEntitySizeLimit=0 -Djdk.xml.totalEntitySizeLimit=0 -Djdk.xml.entityExpansionLimit=0"
        run: mvn -B -U -Dheadless=true verify
      - name: Archive surefire reports (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt

  vscode-tests:
    name: VS Code Mocha tests
    runs-on: ubuntu-latest
    needs: java-tests
    defaults:
      run:
        working-directory: tools/eclipse/udb-vscode
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tools/eclipse/udb-vscode/package-lock.json
      - name: Setup Temurin JDK 21 (for LS)
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install deps
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Run VS Code tests
        run: xvfb-run -a npm test
      - name: Archive VS Code test logs (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-test-logs
          path: |
            tools/eclipse/udb-vscode/.vscode-test/**/*
            tools/eclipse/udb-vscode/out/test/**/*

  create-gems:
    name: Create the gems
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gem: [idlc, udb, udb_helpers]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Copy the gem directory to resolve symlinks
        run: cp -L -r tools/ruby-gems/${{ matrix.gem }} gem-build-dir
      - if: matrix.gem == 'idlc'
        name: Stage tree-sitter grammar version + C sources into the idlc gem
        # At install time ext/idlc/extconf.rb downloads a prebuilt grammar
        # (keyed by TS_IDL_VERSION) and falls back to compiling the C sources +
        # headers. Stage all of them.
        run: |
          mkdir -p gem-build-dir/ext/idlc
          cp tools/node/tree-sitter-idl/TS_IDL_VERSION gem-build-dir/ext/idlc/
          cp tools/node/tree-sitter-idl/src/parser.c  gem-build-dir/ext/idlc/
          cp tools/node/tree-sitter-idl/src/scanner.c gem-build-dir/ext/idlc/
          cp -r tools/node/tree-sitter-idl/src/tree_sitter gem-build-dir/ext/idlc/
      - if: matrix.gem == 'idlc'
        name: Stage Topiary queries + reflow script into the idlc gem
        # Idl::Formatter looks for lib/idlc/queries and lib/idlc/idl-reflow
        # inside the installed gem; without staging them the gem silently
        # skips formatting/reflow.
        run: |
          cp -r tools/node/tree-sitter-idl/queries gem-build-dir/lib/idlc/queries
          mkdir -p gem-build-dir/lib/idlc/idl-reflow
          cp tools/node/idl-reflow/index.js gem-build-dir/lib/idlc/idl-reflow/index.js
      - if: matrix.gem == 'udb'
        name: Stage the bundled spec data into the udb gem
        # udb.gemspec packages .data/**/* (see release:udb:prepare's after_copy
        # in tasks.rake, which this mirrors): without it, Udb.default_cfgs_path
        # and friends resolve to an empty directory in an installed gem with no
        # repo checkout reachable, and the gem is unusable stand-alone.
        run: |
          mkdir -p gem-build-dir/.data/spec/std gem-build-dir/.data/spec/custom
          cp -r spec/std/isa    gem-build-dir/.data/spec/std/isa
          cp -r spec/custom/isa gem-build-dir/.data/spec/custom/isa
          cp -r spec/schemas    gem-build-dir/.data/spec/schemas
          cp -r cfgs            gem-build-dir/.data/cfgs
      - name: Create the ${{ matrix.gem }} gem
        run: |
          cd gem-build-dir && \
          gem build -o ${{ matrix.gem }}.gem ${{ matrix.gem }}.gemspec
      - name: Upload the ${{ matrix.gem }} gem
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.gem }}.gem
          path: gem-build-dir/${{ matrix.gem }}.gem

  udb-gem-z3:
    name: Test udb gem using z3 across several distros and platforms
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        container:
          - almalinux:8
          - ruby:3-slim
    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}
    needs: create-gems
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - if: matrix.container == 'almalinux:8'
        name: Install ruby
        run: |
          dnf module enable -y ruby:3.3
          dnf install -y ruby ruby-devel gcc-toolset-12
          PRE="source scl_source enable gcc-toolset-12"
          echo "PRE=$PRE" >> "$GITHUB_ENV"
      - if: matrix.container == 'ruby:3-slim'
        name: Install make and a C compiler
        # idlc ships a native extension (tree-sitter grammar) compiled at
        # install time, so a C toolchain is required, not just make.
        run: |
          apt-get update -qq && \
          apt-get install --no-install-recommends -y make gcc libc6-dev
      - name: download udb gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: udb.gem
      - name: download idlc gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: idlc.gem
      - name: download udb_helpers gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: udb_helpers.gem
      - name: install gems
        run: |
          $PRE && \
          gem install idlc.gem && \
          gem install udb_helpers.gem && \
          gem install udb.gem
      - name: try z3
        run: ruby -r 'udb' -e "Udb::Z3Loader.ensure_z3_loaded"
      - name: gem install smoke test (source gem — see idlc.gemspec)
        run: ruby tools/test/gem_install_smoke_test.rb

  create-idlc-platform-gem:
    name: Create the idlc platform gem (precompiled grammar, no extconf.rb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build the tree-sitter grammar
        run: make -C tools/node/tree-sitter-idl libtree-sitter-idl.so
      - name: Copy the gem directory to resolve symlinks
        run: cp -L -r tools/ruby-gems/idlc gem-build-dir
      - name: Stage the precompiled grammar so idlc.gemspec builds a platform gem
        # idlc.gemspec checks for this file's presence at `gem build` time: if
        # present, it builds a Gem::Platform.local-tagged gem with the .so
        # bundled directly and no ext/idlc/extconf.rb at all.
        run: cp tools/node/tree-sitter-idl/libtree-sitter-idl.so gem-build-dir/lib/idlc/libtree-sitter-idl.so
      - name: Stage Topiary queries + reflow script into the idlc gem
        run: |
          cp -r tools/node/tree-sitter-idl/queries gem-build-dir/lib/idlc/queries
          mkdir -p gem-build-dir/lib/idlc/idl-reflow
          cp tools/node/idl-reflow/index.js gem-build-dir/lib/idlc/idl-reflow/index.js
      - name: Create the idlc platform gem
        run: cd gem-build-dir && gem build -o idlc-platform.gem idlc.gemspec
      - name: Upload the idlc platform gem
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: idlc-platform.gem
          path: gem-build-dir/idlc-platform.gem

  test-idlc-platform-gem:
    name: Test the idlc platform gem install
    runs-on: ubuntu-24.04
    needs: [create-idlc-platform-gem, create-gems]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: download idlc platform gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: idlc-platform.gem
      - name: download udb gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: udb.gem
      - name: download udb_helpers gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: udb_helpers.gem
      - name: install gems
        # No C compiler needed here: the platform gem ships a precompiled .so
        # and has no ext/idlc/extconf.rb, unlike the source gem tested above.
        # --user-install: this job runs directly on the runner (no container,
        # unlike udb-gem-z3 below), where the default system Ruby's gem dir
        # isn't writable by the runner user.
        run: |
          gem install --user-install idlc-platform.gem && \
          gem install --user-install udb_helpers.gem && \
          gem install --user-install udb.gem
      - name: gem install smoke test (platform gem — see idlc.gemspec)
        run: ruby tools/test/gem_install_smoke_test.rb
